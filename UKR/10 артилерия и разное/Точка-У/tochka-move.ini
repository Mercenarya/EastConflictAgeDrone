
[core]
tags:dar,9k720,fullBK
showInEditor:false
name: Tochka_move
displayLocaleKey: NUKE
displayText: Точка-У
displayDescription: ТРК \n Тактический ракетный комплекс

class: CustomUnitMetadata
price: 100000,Ammo=50000,Oil=11000
maxHp: 700
mass: 30000
maxTransportingUnits: 0
transportSlotsNeeded:130
techLevel: 2
buildSpeed: 95s
#availableInDemo: true

radius: 30
displayRadius: 70

fogOfWarSightRange:8
isBio: false
softCollisionOnAll: 0

[action_Pon]
text: Купить Ракету
displayType: action
buildSpeed: 30s
isVisible:if self.hasFlag(id=4)
addResources:9М79HE=1,setFlag=2,unsetFlag=4
resetCustomTimer:true
price:60000

[action_upgradeT2]
convertTo: Tochka
price:  0
text: Decomposition of the gun
text_ru: Развернуться
whenBuilding_cannotMove: true
whenBuilding_rotateTo: 270
whenBuilding_playAnimation: siloOpen1


displayType: upgrade
buildSpeed: 35s


[graphics]
total_frames: 1

image:        base2.png
image_wreak:  sdox.png
image_turret: roketa.png

scaleTurretImagesTo: 35
imageScale:0.7

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 0


dustEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

[turret_RRR]
#nuke turret
canShoot: false

x: 0
y: 0
invisible:if self.hasFlag(id=4)

[arm_1]
x:-0.2
y:0.5
image_end:levo.png
drawOverBody:true

[arm_2]
x:0.9
y:0.5
image_end:pravo.png
drawOverBody:true


[animation_siloOpen1]

#pingPong: true
#blendIn: 0.5s
#blendOut: 4.0s

arm1_0s:  {x:0, y:0}

arm1_6s: {x:0, y:0}

arm1_12s: {x:-7,  y:0}


arm1_35s: {x:-7,  y:0}

#arm1_40s: {x:-7,  y:0}


#1234567890

arm2_0s:   {x:0, y:0}

arm2_6s:  {x:0, y:0}

arm2_12s:  {x:7, y:0}

arm2_35s:  {x:7, y:0}

#arm2_40s:  {x:7, y:0}


[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.03

maxTurnSpeed: 0.3
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false




[action_trigger_start]
autoTrigger:if numberOfUnitsInTeam(withTag='dar',greaterThan=0)

isVisible:false
showMessageToAllPlayers:ТРК на поле боя
temporarilyRemoveTags:dar

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: setFlag=1,setFlag=2,9М79HE=1,fuel=150

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.5

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=200) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=3





[action_trigger_notfullleft]
autoTrigger:if self.hasFlag(id=4) and not self.hasFlag(id=3)
isVisible:false

temporarilyRemoveTags:fullBKleft,fullBK
temporarilyAddTags:emptyBKleft


[action_trigger_notfullright]
autoTrigger:if self.hasFlag(id=3) and not self.hasFlag(id=4)
isVisible:false

temporarilyRemoveTags:fullBKright,fullBK
temporarilyAddTags:emptyBKright


[action_trigger_empty]
autoTrigger:if self.hasFlag(id=4) and self.hasFlag(id=3)
isVisible:false

temporarilyRemoveTags:fullBK
temporarilyAddTags:emptyBK,emptyBKright,emptyBKleft


[action_trigger_full]
autoTrigger:if not self.hasFlag(id=4) and not self.hasFlag(id=3)
isVisible:false

temporarilyRemoveTags: emptyBK
temporarilyAddTags: fullBK






































