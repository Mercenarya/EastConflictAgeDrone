

[core]

name: M113
displayText: M113A3

#overrideAndReplace: experimentalSpider
tags: ARMOR
class: CustomUnitMetadata
price: 500,Oil=3030,Ammo=250
maxHp: 550
mass: 3000
armour:70
armourMinDamageToKeep:0

displayDescription: APC\nCan carry up to 12 people \n Normal armor
displayDescription_ru: БТР\nМожет перевозить до 12 солдат \n Средняя броня, почуствуй запах джунглей

techLevel: 1
buildSpeed: 10s
#availableInDemo: true

maxTransportingUnits: 11
transportSlotsNeeded:25
radius: 25
displayRadius: 30

fogOfWarSightRange: 8

isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder: ROOT:/ogg/amer/AAVP.OGG

energyMax: 25
energyRegen: 1
energyNeedsToRechargeToFull: true

unitsSpawnedOnDeath:M113_dead*1

#[action_trigger_onWater]
#autoTrigger: if self.overWater()
#if self.isoveropenland()
#buildSpeed: 0
#text: Land mode
#isVisible: false



[graphics]
total_frames: 1

image:        1.png
image_wreak:  none
image_turret: null.png
scaleImagesTo: 40

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false


turretSize: 20
turretTurnSpeed: 3.5

maxAttackRange: 250
shootDelay: 15

turretMultiTargeting: true

[turret_2]
x:0
y:0

[movement]
movementType: LAND
moveSpeed:0.8
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 1.2
turnAcceleration: 0.50

moveSlidingMode :false
moveIgnoringBody:false





[arm_1]
x:0
y:21
image_end:null.png
drawOverBody:true

[animation_siloOpen]

#pingPong: true
blendIn: 0.5s
#blendOut: 4.0s

arm1_0: {x:0, y:0}

arm1_0.5s: {x:0, y:2}

arm1_1s: {x:0, y:4}

[animation_silo]

#pingPong: true
blendIn: 0.5s
#blendOut: 4.0s

arm1_0: {x:0, y:4}

arm1_0.5s: {x:0, y:4}

arm1_2s: {x:0, y:4}


[animation_siloClosed]

#pingPong: true
blendIn: 0.5s
#blendOut: 4.0s

arm1_0: {x:0, y:0}

arm1_0.5s: {x:0, y:-2}

arm1_1s: {x:0, y:-4}




[action_out_1]
autoTrigger: if self.overWater and self.resource(type='kostyl',lessThan=1)
playAnimation: siloOpen
resourceAmount: kostyl
resourceAmount_setValue:1
isVisible: false


[action_out_2]
autoTrigger: if self.overWater and self.resource(type='kostyl',greaterThan=0)
playAnimation: silo
resourceAmount: kostyl
resourceAmount_setValue:1
isVisible: false


[action_trigger_1]
autoTrigger: if self.isoveropenland() and self.resource(type='kostyl',greaterThan=0)
playAnimation: siloClosed
resourceAmount: kostyl
resourceAmount_setValue:0
isVisible: false


[resource_kostyl]
displayName: kostyl
displayColor:#6C408CFF
hidden:true


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=220,grob=1

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.3

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=140) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=3



 

