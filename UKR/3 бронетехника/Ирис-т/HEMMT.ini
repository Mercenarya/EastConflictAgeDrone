

[core]
name: IRIS-t
displayText:  IRIS-T SLM

#overrideAndReplace: tank
tags: armor,BUK
class: CustomUnitMetadata
price: 15000,Oil=3500,Ammo=19000
maxHp: 200
mass: 30000
armour:35
armourMinDamageToKeep:0


displayDescription: The anti-aircraft missile system of Germany \n Has a short- and medium-range missile equipped with a cooled infrared homing head, which allows to implement the principle of "shot and forgot".
displayDescription_ru: Зенитно-ракетный комплекс ФРГ \n Имеет ракету малой и средней дальности, оснащённая охлаждаемой инфракрасной головкой самонаведения, позволяющая реализовать принцип "выстрелил и забыл".
techLevel: 2
buildSpeed: 45s
#availableInDemo: true
fogOfWarSightRange: 6
maxTransportingUnits: 0
transportUnitsRequireTag:s400
transportUnitsEachUnitAlwaysUsesSingleSlot:true
transportSlotsNeeded:120
radius: 40
displayRadius: 50
exit_dirOffset:180

isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:ogg/amer/m939.OGG

energyMax: 400
energyRegen: 0.02
energyNeedsToRechargeToFull: true


[action_depun]
text:Развернуть
buildSpeed: 5s
pos: 0.01
convertTo:IRIS-T_roc_fire


[graphics]
total_frames: 1

image:        sosika.png
image_wreak:  dead.png
image_turret: NONE

scaleImagesTo: 33


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false


turretSize: 30
turretTurnSpeed: 1

maxAttackRange: 1
shootDelay: 1



[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.05

maxTurnSpeed: 0.45
turnAcceleration: 0.05

moveSlidingMode :true
moveIgnoringBody:false


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=160,PAC3=8


[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.4

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=170) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=3

[action_ammo1]
isLocked:true
isVisible:if self.resource(type='PAC3',greaterThan=0)
#isActive: false
text: ammo
text_ru: Боезапас
description: -
description_ru: Сколько осталось боезапаса
iconImage:ROOT:/PNG/Ammunition.png
addResources: PAC3=1
price:  PAC3=1

buildSpeed: 0s
pos: 0.2
displayRemainingStockpile: true
displayType: infoOnlyStockpile






[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true



























