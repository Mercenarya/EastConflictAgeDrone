fogOfWarSightRange:6

[graphics]
showHealthBar:false
showEnergyBar:false
icon_zoomed_out_neverShow:true
total_frames: 1

scaleImagesTo:       37
scaleTurretImagesTo: 37
image:        MPQ-53.png
image_wreak:  MPQ-53_dead.png
image_turret: MPQ-53_Radar.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: false



[decal_sweepLine]
@define SweepTimeMultiplier: 72
onlyWhenSelectedByOwnPlayer: true
drawLineTo: self.getOffsetRelative(y=${EZRD_Range}, dirOffset=self.timeAlive*${SweepTimeMultiplier})
