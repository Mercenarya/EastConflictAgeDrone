#This one is purely decorative

[attack]


canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

maxAttackRange: ${EZRD_Range}
#${EZRD_Range}
showRangeUIGuide: true
#This shows radar range if only one radar is selected




[turret_2]
#pac3
x: 0
y: -40
canShoot:false
limitingAngle:50

[turret_1]
#pac3
x: 0
y: 70
attachedTo:2
slave:true
invisible:true
canAttackCondition:if numberOfUnitsInTeam(withTag='EPP',withinRange=200,greaterThan=0)
delay:1.9s
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
warmup:0.1s

projectile: 1

[projectile_1]
directDamage: 0
targetGround:true
life: 100
frame: 4
speed: 100
drawSize: 0.001
spawnUnit: ZasvetAir*1
explodeEffect:none

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.01



[action_reset]
