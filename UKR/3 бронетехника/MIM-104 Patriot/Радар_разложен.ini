
[core]
copyFrom: ROOT:template\EasyRadar\copyFrom\radar.copyFrom

@global EZRD_timeBetween: 5.5

@global EZRD_revealerUnit: RadarBlip

@global EZRD_Range: 4444

@global EZRD_Tag: air,Air


tags:radar,patriotradar,a50tag
name: patriot_radar_state
displayText: MPQ-53
displayDescription: Oh, why did you come here...
class: CustomUnitMetadata
price: 6000
maxHp: 600
mass: 300000
armour:12
showInEditor: false

techLevel: 1
buildSpeed: 0.0012
#availableInDemo: true

radius: 40
