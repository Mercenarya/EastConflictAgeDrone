

[core]
name: PATRIOT_pack2
displayText: HEMTT(MIM-104) (PAC 2 GEM)

#overrideAndReplace: tank
tags: ARMOR
class: CustomUnitMetadata
price: 20000,Oil=3500,Ammo=20000
maxHp: 200
mass: 30000
armour:35
armourMinDamageToKeep:0

displayDescription:This is a modernization of the MIM-104D/E Patriot system carried out in the 1990s to improve its effectiveness in intercepting ballistic and cruise missiles. \n It has a range of 95 kilometers, which allows it to defend a vast area against airborne threats.  \n The ammunition load for a single launcher is limited to 4 missiles.

displayDescription_ru:Это модернизация комплекса MIM-104D/E Patriot в 1990-х годах с целью повышения эффективности перехвата баллистических и крылатых ракет. \n Обладает дальностью в 95 километров, что позволяет закрывать обширную зону от средств воздушного нападения.  \n Боекомплект одной пусковой установки ограничен 4 ЗУР

techLevel: 2
buildSpeed: 50s
#availableInDemo: true
fogOfWarSightRange: 6
maxTransportingUnits: 1
transportUnitsRequireTag:s400
transportUnitsEachUnitAlwaysUsesSingleSlot:true
transportSlotsNeeded:120
radius: 40
displayRadius: 50
exit_dirOffset:180

isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:ogg/amer/m939.OGG

energyMax: 400
energyRegen: 0.02
energyNeedsToRechargeToFull: true


[graphics]
total_frames: 1

image:        HEMMT.png
image_wreak:  HEMMT_dead.png
image_turret: NONE

scaleImagesTo: 40


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false


turretSize: 30
turretTurnSpeed: 1

maxAttackRange: 1
shootDelay: 1


[attachment_gun]
x: 0
y: -40
onCreateSpawnUnitOf:patriot_roc_pack2
addTransportedUnits:true
canBeAttackedAndDamaged: false
isUnselectable: false
keepAliveWhenParentDies:false
rotateWithParent:false
resetRotationWhenNotAttacking:true

[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.05

maxTurnSpeed: 0.45
turnAcceleration: 0.05

moveSlidingMode :true
moveIgnoringBody:false

[action_trigger_go]
autoTrigger:if self.isMoving()
temporarilyAddTags:move
isVisible:false

[action_trigger_notgo]
autoTrigger:if not self.isMoving()
temporarilyRemoveTags:move
isVisible:false

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=160

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.4

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=170) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=3




























