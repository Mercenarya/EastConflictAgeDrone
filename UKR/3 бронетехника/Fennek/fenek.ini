description: Anti-personel
description_ru: Против пехоты
buildSpeed: 0


[action_shell2]
isVisible: if self.hasFlag(id=2) and not self.hasFlag(id=4)
text: HEAT
text_ru: Кумулятивный
description: Anti-armor
description_ru: Против бронетехники
buildSpeed: 0



[hiddenAction_start]
autoTriggerOnEvent: created
addResources:40HE=200,40HEAT=200,setFlag=1,fuel=60


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:40HE=10,40HEAT=10

[movement]
movementType: LAND
moveSpeed: 1.1
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.05

maxTurnSpeed: 1.1
turnAcceleration: 0.5

moveSlidingMode :false
moveIgnoringBody:false

[ai]
useAsBuilder: true



[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=60) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=1









































