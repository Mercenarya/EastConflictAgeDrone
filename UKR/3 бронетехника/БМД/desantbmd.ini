[core]
name: desantbmd
displayText_ru: Десантный отсек
displayText: Paratrooper compartment

displayDescription:This is where you can place your infantrymen for protection and transportation \n Allied units can also board it if it is empty.
displayDescription_ru: Здесь вы можете разместить своих пехотинцев для защиты и транспортировки \n Союзные подразделения также могут садиться в него , если он пуст
class: CustomUnitMetadata
price: 2
maxHp: 800
mass: 300000

stayNeutral:true
transportUnitsKillOnDeath:false
whileNeutralTransportAnyTeam:true
whileNeutralConvertToTransportedTeam:true
transportUnitsCanUnloadUnits:if not self.isControlledByAi()


showInEditor: false

techLevel: 1
buildSpeed: 0.0012
#availableInDemo: true

radius: 10
displayRadius: 10
exit_dirOffset : 0
energyMax: 3
energyRegen: 0.004
energyNeedsToRechargeToFull: true

maxTransportingUnits: 5
transportUnitsBlockOtherTransports:false

isBio: false
softCollisionOnAll: 0


fogOfWarSightRange:0

[graphics]
showHealthBar:false
showEnergyBar:false
icon_zoomed_out_neverShow:true
total_frames: 1
imageScale: 0.9

image:        null.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: false

lock_body_rotation_with_main_turret: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 12
turretTurnSpeed: 0.5

isFixedFiring: false

maxAttackRange: 700
shootDelay: 200



[movement]
movementType: LAND
moveSpeed: 0.0
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.17

maxTurnSpeed: 2.5
turnAcceleration: 0.25

moveSlidingMode :false
moveIgnoringBody:false


[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true

[hiddenAction_vehicleEmpty]
autoTrigger:if self.transportingCount() == 0
clearActiveWaypoint:true
switchToNeutralTeam:true

[hiddenAction_ii]
autoTrigger:if self.isOnNeutralTeam() and self.transportingCount() >= 1
startUnloadingTransport:true


