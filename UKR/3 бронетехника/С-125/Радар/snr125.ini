[core]
copyFrom: ROOT:template\EasyRadar\copyFrom\radar.copyFrom

@global EZRD_timeBetween: 0.1

@global EZRD_revealerUnit: RadarBlip

@global EZRD_Range: 3380

@global EZRD_Tag: zasvetArtaUa


name: SNR-125-2D
displayText_ru:  СНР-125-2Д
displayText:  SNR-125-2D

displayDescription: The SNR-125-2D missile guidance station provides detection, tracking, and guidance of anti-aircraft missiles against aerial targets. \n It is equipped with modern digital signal processing equipment and improved tracking capabilities. \n It ensures stable operation in the presence of active electronic countermeasures. \n It serves as the primary fire control element of the S-125-2D system, significantly enhancing its combat effectiveness.

displayDescription_ru: Станция наведения ракет СНР-125-2Д обеспечивает обнаружение, сопровождение и наведение зенитных ракет на воздушные цели. \n Оснащена современной цифровой аппаратурой обработки сигналов и улучшенными средствами сопровождения. \n Обеспечивает устойчивую работу в условиях активных радиоэлектронных помех. \n Является основным элементом управления огнём комплекса С-125-2Д, значительно повышая его боевую эффективность.
class: CustomUnitMetadatak
price: 2
maxHp: 100
mass: 300000
tags:noarmor,a50tag,snr125,radar

showInEditor: true

techLevel: 1
buildSpeed: 0.0012
#availableInDemo: true

radius: 5
displayRadius: 15
exit_dirOffset : -10
energyMax: 3
energyRegen: 0.004
energyNeedsToRechargeToFull: true

maxTransportingUnits: 0
transportUnitsBlockOtherTransports:false

isBio: false
softCollisionOnAll: 0


fogOfWarSightRange:0

[graphics]
showHealthBar:false
showEnergyBar:false
icon_zoomed_out_neverShow:true
total_frames: 1
imageScale: 0.64
scaleTurretImagesTo: 65

image:        radar2.png
image_wreak:  NONE
image_turret: radar3.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: false

lock_body_rotation_with_main_turret: false

[decal_sweepLine]
@define SweepTimeMultiplier: 72
onlyWhenSelectedByOwnPlayer: true
drawLineTo: self.getOffsetRelative(y=${EZRD_Range}, dirOffset=self.timeAlive*${SweepTimeMultiplier})
color: #00FF00
#This one is purely decorative

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 12
turretTurnSpeed: 0.5

isFixedFiring: true

maxAttackRange: ${EZRD_Range}
#${EZRD_Range}
showRangeUIGuide: true
shootDelay: 7

[turret_2]
x:0
y:-40
canShoot:false
image:null.png

[turret_1]
x:0
y:0
attachedTo: 2
slave: true 
idleSweepAngle:120
idleSweepDelay:210
idleSweepSpeed:0.5


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
maxTurnSpeed: 0
turnAcceleration: 0

