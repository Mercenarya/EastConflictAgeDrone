[core]
name: SNR-125-2D_move
displayText_ru:  СНР-125-2Д
displayText:  SNR-125-2D

displayDescription: The SNR-125-2D missile guidance station provides detection, tracking, and guidance of anti-aircraft missiles against aerial targets. \n It is equipped with modern digital signal processing equipment and improved tracking capabilities. \n It ensures stable operation in the presence of active electronic countermeasures. \n It serves as the primary fire control element of the S-125-2D system, significantly enhancing its combat effectiveness.

displayDescription_ru: Станция наведения ракет СНР-125-2Д обеспечивает обнаружение, сопровождение и наведение зенитных ракет на воздушные цели. \n Оснащена современной цифровой аппаратурой обработки сигналов и улучшенными средствами сопровождения. \n Обеспечивает устойчивую работу в условиях активных радиоэлектронных помех. \n Является основным элементом управления огнём комплекса С-125-2Д, значительно повышая его боевую эффективность.

class: CustomUnitMetadatak
price: 2
maxHp: 100
mass: 300000
tags:noarmor

showInEditor: true

techLevel: 1
buildSpeed: 0.0012
#availableInDemo: true

radius: 5
displayRadius: 15
exit_dirOffset : -10
energyMax: 3
energyRegen: 0.004
energyNeedsToRechargeToFull: true

maxTransportingUnits: 0
transportUnitsBlockOtherTransports:false

isBio: false
softCollisionOnAll: 0


fogOfWarSightRange:0

[graphics]
showHealthBar:false
showEnergyBar:false
icon_zoomed_out_neverShow:true
total_frames: 1
imageScale: 0.64
scaleTurretImagesTo: 65

image:        radar1.png
image_wreak:  NONE
image_turret: radar3.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: false

lock_body_rotation_with_main_turret: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 12
turretTurnSpeed: 0.5

isFixedFiring: true

maxAttackRange: 100
shootDelay: 200

[turret_2]
x:0
y:-40
canShoot:false


[movement]
movementType: land
moveSpeed: 0
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.04


maxTurnSpeed: 1
turnAcceleration: 0.03

moveSlidingMode :false
moveIgnoringBody:false


[action_turn]
autoTrigger:if not self.hasParent(withTag="move")
setUnitStats:maxTurnSpeed=0
isVisible:false

[action_notTurn]
autoTrigger: if self.hasParent(withTag="move" )
setUnitStats: maxTurnSpeed=${movement.maxTurnSpeed}
isVisible:false

[action_depun]
text:Развернуть
buildSpeed: 5s
pos: 0.01
convertTo:SNR-125-2D
disconnectFromParent:true
