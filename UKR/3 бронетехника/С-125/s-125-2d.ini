displayText_ru: С-125-2Д
displayText: S-125-2D

displayDescription:The S-125-2D surface-to-air missile system is designed to engage aircraft, helicopters, cruise missiles, and other aerial targets. \n It is equipped with modernized target detection and tracking systems. \n It employs guided anti-aircraft missiles with increased range and strike effectiveness. \n It has high resistance to jamming and is capable of operating effectively in complex air defense environments.
displayDescription_ru: Зенитный ракетный комплекс С-125-2Д предназначен для поражения самолётов, вертолётов, крылатых ракет и других воздушных целей. \n Оснащён модернизированными средствами обнаружения и сопровождения целей. \n Применяет управляемые зенитные ракеты с повышенной дальностью и эффективностью поражения. \n Обладает высокой помехозащищённостью и способен эффективно действовать в сложной воздушной обстановке.
