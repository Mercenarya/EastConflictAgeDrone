
[core]
name: hmmwv_mpq
class: CustomUnitMetadata
price: 650,Oil=980,Ammo=540
maxHp: 150
mass: 3000
armour:10
armourMinDamageToKeep:0
displayText: HMMWV (MPQ-64)
displayText_ru: HMMWV (MPQ-64)
displayDescription: Light universal vehicle\n-Armed with M2HB MG\n-Weakly armored
displayDescription_ru: Легкий универсальный вездеход\n-Вооружен пулеметом М2НВ\n-Слабо защищён 

techLevel: 1
buildSpeed: 9s
#availableInDemo: true

radius: 20
displayRadius: 20
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 15
energyMax: 7
energyRegen: 0.001
energyNeedsToRechargeToFull: true

transportSlotsNeeded: 16
maxTransportingUnits: 1

transportUnitsRequireTag:mpq64
transportUnitsEachUnitAlwaysUsesSingleSlot:true

canRepairBuildings: false
canRepairUnits : false
autoRepair: false

nanoRange: 100
nanoBuildSpeed: 2.0
#soundOnMoveOrder: ROOT:/ogg/amer/Humvee.OGG

[graphics]
total_frames: 1

image:        HMMWV_2.png
image_wreak:  HMMWV_dead.png
image_turret: none
scaleImagesTo: 50


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true
imageScale: 0.5

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false



turretSize: 20
turretTurnSpeed: 1.5

maxAttackRange: 320
shootDelay: 1

turretMultiTargeting: true




[hiddenAction_start]
autoTriggerOnEvent: created
addResources:fuel=100

[movement]
movementType: LAND
moveSpeed: 1.4
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.05

maxTurnSpeed: 1
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false

[ai]
useAsBuilder: true

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.3

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=100) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=1






[attachment_gun]
x: 0
y: -17.5
onCreateSpawnUnitOf:mpq64
addTransportedUnits:true
canBeAttackedAndDamaged: false
isUnselectable: false
keepAliveWhenParentDies:false
rotateWithParent:false
resetRotationWhenNotAttacking:true





[action_trigger_go]
autoTrigger:if self.isMoving()
temporarilyAddTags:move
isVisible:false

[action_trigger_notgo]
autoTrigger:if not self.isMoving()
temporarilyRemoveTags:move
isVisible:false













