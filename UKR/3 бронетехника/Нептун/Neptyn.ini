
[core]

name: Neptyn

tags:armor,noarmor,rf,AntiShip,rocket

#overrideAndReplace: heavyTank

class: CustomUnitMetadata
price: 18000,Oil=7000,Ammo=12500
maxHp: 400
mass: 3000
armour:56
armourMinDamageToKeep:0
displayText: RK-360MC "Neptune"
displayText_ru: РК-360МЦ «Нептун»
displayDescription: Ukrainian coastal mobile missile system with R-360 Neptune anti-ship missiles.
displayDescription_ru: Український береговий мобільний ракетний комплекс з протикорабельними ракетами Р-360 Нептун.
fogOfWarSightRange: 8
techLevel: 1
buildSpeed: 30s
#availableInDemo: true
transportSlotsNeeded: 200
maxTransportingUnits: 0

radius: 35
displayRadius: 50

isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:/ogg/rf/engine_shilka.OGG

energyMax: 500
energyRegen: 0.6
energyNeedsToRechargeToFull: true

[graphics]
total_frames: 1

image:        Neptyn.png
image_wreak:  dead.png
image_turret: Pon.png

scaleImagesTo: 30
scaleTurretImagesTo: 30


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   if self.numberOfUnitsInTeam(withTag='mineral',greaterThan=0,withinRange=1000)
canAttackUnderwaterUnits:  if self.numberOfUnitsInTeam(withTag='mineral',greaterThan=0,withinRange=1000)

turretSize: 10
turretTurnSpeed: 1

maxAttackRange: 2700
shootDelay: 1s



[turret_MainGun]
x: 0
y: -55
canAttack:true

limitingAngle:25
canOnlyAttackUnitsWithTags:ship

resourceUsage:ammo=1

projectile:1
shoot_sound:ROOT:/ogg/rf/Igla.ogg
shoot_sound_vol:1
onShoot_triggerActions:lunch
delay:10s


[projectile_1]
#X35
#heat
directDamage: 3500
armourIgnoreAmount:500
areaDamage: 1500
shieldDamageMultiplier:3
areaRadius: 35
largeHitEffect: true
life: 1
speed:4


image:ROOT:/PNG/null.png
drawSize:0.6
tags:pkr

turnSpeed:1
friendlyFire:true
initialUnguidedSpeedHeight: 1.2
gravity:0.01

[effect_projectileTrail]
priority:critical

stripIndex: effects
frameIndex: 0


life: 150
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime:1.5
scaleFrom: 0.5
scaleTo: 0.5
alpha: 1
drawUnderUnits:false

atmospheric:true


shadow:true
yOffsetRelative: -10
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2





[effect_pyro]
spawnChance:1
life:60
alpha:0
alsoEmitEffects:CUSTOM:sparks*6,CUSTOM:sparks2*4, smoke

[effect_sparks]
attachedToUnit: false
life: 150
scaleFrom:1
scaleTo: 0.4
physics: true
xSpeedRelativeRandom: 1
ySpeedRelativeRandom: 1
hSpeed: 1
priority: low

[effect_sparks2]
attachedToUnit: false
life: 150
scaleFrom:1.6
scaleTo: 0.3
physics: true
xSpeedRelativeRandom: 2
ySpeedRelativeRandom: 2
hSpeed: 1
priority: low




[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 0.6
turnAcceleration: 0.50

moveSlidingMode :false
moveIgnoringBody:false


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1) and self.resource(type='ammo',lessThan=4)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 20s
addResources:ammo=1

[hiddenAction_start]
autoTriggerOnEvent: created
addResources:fuel=200,ammo=4

[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true


[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.3

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=130) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=2


[action_lunch]
spawnUnits:R360
isVisible:false






























































































