displayDescription: German infantry fighting vehicle \n Medium protection, can protect against large-caliber bullets, but if you're lucky, it can withstand several or more caliber shells \n Rh202 automatic 20mm cannon \n Milan ATGM \n Speed reaches 40-70 km/h \n Hull turning speed - medium \n Can carry up to 8 soldiers in full gear \n A good IFV to support heavy armored vehicles and a good means of breaking through enemy defenses, good mannerisms and speed, but the armor leaves much to be desired.
displayDescription_ru:Немецкая боевая машина пехоты \n Средняя защищённость, может защитить от крупнокалиберных пуль, но если повезёт, выдержит несколько снарядов калибра и побольше \n Автоматическая 20мм пушка Rh202 \n ПТРК Милан \n Скорость 40-70 км/ч \n Скорость доворота корпуса - Средняя \n Может перевозить до 8 солдат в полной экипировке \n Хорошая БМП для поддержки тяжёлой бронетехники и хорошее средство для прорыва обороны противника, хорошая манерность и скорость, но броня оставляет желать лучшего. \n Стоп, но Мардер это же немецкая самоходка Второй мировой! \n Лёгкий, маневренный и быстрый, есть даже цитата «Быстрые ноги пизды не получат»
