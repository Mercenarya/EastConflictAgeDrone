displayDescription_ru: Советско-российский ОБТ \n Хорошая броня - 310мм во лбу корпуса \n 125мм орудие 2А26\n 7.62 пулемет ПКТ и 12.7мм Утес \n Скорость до 40-50 км/ч \n Скорость доворота корпуса - плохая \n Отличный танк для начала боя, имеет хорошую броню и мощное орудие, которое отлично расправляется с более легкой техникой противника, но с мод. танками могут возникнуть проблемы \n Используй его, люби его, ненавидь его 

