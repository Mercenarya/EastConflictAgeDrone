[core]
copyFrom:ROOT:/template/Infantry.template
name: OperatorUKR
class: CustomUnitMetadata
price: 200
maxHp: 100
mass: 30
tags: infantry, UAV, UAV_OPERATOR, operator
armour: 10
armourMinDamageToKeep: 0
displayText: Operator UAV (UA)
displayText_ru: Оператор БПЛА (Украина)
displayDescription: - Armed Forces of Ukraine (AFU) UAV Operator \n- Specializes in aerial reconnaissance with UAV LiDAR \n- Equipped with tactical drone control terminal
displayDescription_ru: - Оператор БПЛА ЗСУ \n- Воздушная разведка с помощью БПЛА с оптико-лазерным сканером Лидар \n- Оснащен терминалом управления дроном
techLevel: 1
buildSpeed: 5s
fogOfWarSightRange: 16
radius: 8
displayRadius: 8
isBio: true
hideScorchMark: true
softCollisionOnAll: 0
transportSlotsNeeded: 1
soundOnMoveOrder: ROOT:/ogg/rf/1.OGG, ROOT:/ogg/rf/2.OGG, ROOT:/ogg/rf/3.OGG, ROOT:/ogg/rf/4.OGG, ROOT:/ogg/rf/5.OGG, ROOT:/ogg/rf/6.OGG

isBuilder: true
canRepairUnits: true
autoRepair: false
nanoRange: 35
nanoRepairSpeed: 0.3
energyMax: 100
energyRegen: 0.5
energyNeedsToRechargeToFull: false

effectOnDeath: Custom:death

# --- BUILD LIST (UA: UAV LIDAR, Standard Drone, VTOL_UKR & THeMIS UGV) ---
canBuild_1_name: Fixed-wing UAV "Legionare-E", Drone, VTOL_UKR, Vampire
canBuild_1_pos: 1

canBuild_2_name: Themis Armed 12.7, Themis Mk19, Themis UGV
canBuild_2_pos: 2

[graphics]
total_frames: 2

image:        1.png
image_wreak:  2.png
image_turret: NONE
imageScale: 0.35
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1

animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 12

animation_idle_start: 1
animation_idle_end: 1
animation_idle_speed: 1

animation_attack_start: 0
animation_attack_end: 0
animation_attack_speed: 15

lock_body_rotation_with_main_turret: true

[effect_death]
spawnChance: 0.8
alsoEmitEffects: CUSTOM:blood*18

[effect_blood]
image: ROOT:/PNG/Infantry/blood.png
xOffsetRelative: 0
yOffsetRelative: 1
attachedToUnit: false
life: 90
physics: true
xSpeedRelativeRandom: 0.8
ySpeedRelativeRandom: 0.8
hSpeed: 1.2
priority: high
scaleFrom: 0.9
scaleTo: 0.4
dirSpeedRandom: 20

[effect_shell]
xOffsetRelative: 2
yOffsetRelative: -10
attachedToUnit: false
life: 250
physics: true
xSpeedRelative: 0.5
xSpeedRelativeRandom: 0.3
ySpeedRelativeRandom: 0.3
hSpeed: 1.2
image: ROOT:/PNG/Infantry/shell.png
priority: low
drawUnderUnits: true
scaleFrom: 0.6
scaleTo: 0.6
dirSpeedRandom: 20

[attack]
isMelee: false
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretRotateWithBody: true
turretSize: 13
turretTurnSpeed: 6
isFixedFiring: true
aimOffsetSpread: 0.4
maxAttackRange: 240
shootDelay: 8

[turret_shoot]
x: 0
y: -2
projectile: 1
invisible: true
warmup: 5
idleDir: 0
shoot_sound: ROOT:/ogg/rf/ak74.OGG
shoot_sound_vol: 0.7
shoot_flame: CUSTOM:shell
shoot_light: #ffff4900
recoilOffset: 0

[projectile_1]
directDamage: 22
life: 140
speed: 10
frame: 1
image: ROOT:/PNG/Infantry/bala.png
drawSize: 0.4
targetGround: true
targetGroundSpread: 5
areaRadius: 3
areaDamage: 22

[movement]
movementType: LAND
moveSpeed: 0.65
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
maxTurnSpeed: 3
turnAcceleration: 2.5
moveSlidingMode: false
moveIgnoringBody: true
moveSlidingDir: 181

# ==========================================
# UA DRONE LAUNCH ACTIONS: ONLY UAV LIDAR
# ==========================================

