[action_gp25_fire]
fireTurretXAtGround: gp25
fireTurretXAtGround_withProjectile: vog25
text: Fire GP-25 (Point)
text_ru: Выстрел ГП-25 (по цели)
description: Launch a 40mm VOG-25 grenade at the designated point (range 408, +20% over rifle). Reloads after each shot. Requires Single fire mode.
description_ru: Выстрел ВОГ-25 в указанную точку (дальность 408, +20% к дальности автомата). Перезарядка после каждого выстрела. Требуется одиночный режим.
displayType: action
buildSpeed: 1.5s
fireTurretXAtGround_count: 1
playAnimation: gp25Reload
isLocked: if not self.customTimer(laterThanSeconds=4)
resetCustomTimer: true
isVisible: if self.hasFlag(id=2) and self.resource(type='vog25', greaterThan=0)
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: gp25
whenBuilding_rotateTo_waitTillRotated: true
price: vog25=1, energy=20
pos: 0.15

[action_vogAmmo]
isLocked: true
isVisible: if self.hasFlag(id=1) or self.hasFlag(id=2) or self.hasFlag(id=3)
text: VOG-25 (Max 10)
text_ru: ВОГ-25 (Макс 10)
description: VOG-25 40mm grenades carried (max 10 per soldier). Reloads after every shot.
description_ru: Выстрелы ВОГ-25 для ГП-25 (макс. 10 на бойца). Перезарядка после каждого выстрела.
iconImage:ROOT:/PNG/Ammunition.png
addResources: vog25=1
price: vog25=1
buildSpeed: 0s
pos: 0.2
displayRemainingStockpile: true
displayType: infoOnlyStockpile

