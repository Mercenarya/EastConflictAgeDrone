class: CustomUnitMetadata
price: 650,Oil=980,Ammo=540
maxHp: 110
mass: 3000
armour:23
armourMinDamageToKeep:0
displayText: HMMWV (PD-1)
displayText_ru: HMMWV (PD-1)
displayDescription: Light universal vehicle\n-Can carry up to 2 people\n-Armed with M2HB MG\n-Weakly armored
