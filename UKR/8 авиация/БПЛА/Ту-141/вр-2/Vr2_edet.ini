
[core]
tags:vr2,tu141
name: vr2
displayText: Вр-2 (Походное)
displayDescription: Бавовна (пасхалко) хохлы пидорасы  \n Лимит 4 юнита

class: CustomUnitMetadata
price: 2
maxHp: 1500
mass: 300000
armour:12
showInEditor: false

techLevel: 1
buildSpeed: 0.0012
#availableInDemo: true

radius: 25
displayRadius: 70

energyMax: 3
energyRegen: 0.004
energyNeedsToRechargeToFull: true
transportSlotsNeeded:120

isBio: false
softCollisionOnAll: 0

fogOfWarSightRange:6

[graphics]
showHealthBar:false
showEnergyBar:false
icon_zoomed_out_neverShow:true
total_frames: 1

scaleImagesTo:       40
scaleTurretImagesTo: 1
image:        VR2.png
image_wreak:  VR2_dead.png
image_turret: null.png

image_shadow: none
shadowOffsetX:1
shadowOffsetY:1

dustEffect: false


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
turretRotateWithBody: true

turretSize: 12
turretTurnSpeed: 5
maxAttackRange: 2000
shootDelay: 1




[turret_1]
#PU
image:Tu141.png
invisible:if self.ammo(lessThan=1)
x: 0
y: -40




[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0.45
turnAcceleration: 0.01

[action_turn]
autoTrigger:if not self.hasParent(withTag="move")
setUnitStats:maxTurnSpeed=0
isVisible:false

[action_notTurn]
autoTrigger: if self.hasParent(withTag="move" )
setUnitStats: maxTurnSpeed=${movement.maxTurnSpeed}
isVisible:false

[action_set]
convertTo: vr2_state

text: Разложение Пусковой установки!
disconnectFromParent:true

[hiddenAction_alemzhar3]
autoTriggerOnEvent:created
addResources:ammo=1



#============Сперма============#
[action_trigger_delete] 
autoTrigger:if numberOfUnitsInTeam(withTag='tu141', greaterThan=4) 
isVisible:false 
deleteSelf:true























































