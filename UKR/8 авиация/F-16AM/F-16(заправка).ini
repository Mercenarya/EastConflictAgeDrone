
[core]
name: F16R
displayText: F-16AM
displayDescription: Belgian modernization of F-16A under the MLU program. \n Handed over in the summer of 2024 to Ukraine from NATO countries. \n Armed with medium and short-range missiles, guided air-to-surface missiles. \n Good maneuverability. \n Don't shoot your Patriot at it!
displayDescription_ru: Бельгийская модернизация F-16A по программе MLU. \n Переданы летом 2024 Украине от стран НАТО. \n Вооружен ракетами средней и малой дальности , управляемые ракеты воздух-поверхность. \n Хорошая манёвренность.
