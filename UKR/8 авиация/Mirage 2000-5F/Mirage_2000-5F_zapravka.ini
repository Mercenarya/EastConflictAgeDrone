
[core]
name: Mirage_2000_zapravka
displayText: Mirage 2000-5F
displayDescription: A modernized version of the Mirage 2000, capable of using the MICA family of ballistic missiles. \n Well suited for striking ground targets, high maneuverability. \n They were transferred to the Ukrainian Air Force in early 2025.
displayDescription_ru: Модернизированный вариант Mirage 2000 , способный применять УРВВ семейства MICA. \n Хорошо подходит для нанесения ударов по наземным целям, высокая манёвренность. \n Были переданы в ВВС Украины в начале 2025 года.
class: CustomUnitMetadata
price: 2
maxHp: 2000
armour:100
armourMinDamageToKeep:1

energyMax:8000
energyRegen:5
energyNeedsToRechargeToFull:true
showInEditor: false

mass: 10000
transportSlotsNeeded:1

techLevel: 1
buildSpeed: 30s
tags:LightStrikeAirRF,air,AirFHT,StrikeAirRF,hoholbomb,harm,maldb,AirT2UKR,zapravka
radius: 45

isBio: false
softCollisionOnAll: 75
numBitsOnDeath: 5

fogOfWarSightRange: 23

dieOnZeroEnergy:true
explodeOnDeathGroundCollision:true

[graphics]
