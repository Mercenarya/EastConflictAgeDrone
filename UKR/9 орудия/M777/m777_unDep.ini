maxAttackRange: 1
shootDelay: 360





[turret_shoot2]
#
x: 6
y: -3
image:loader.png

shouldResetTurret: false

turnSpeedAcceleration: 0.9

canShoot: false

[turret_1]
#"barrel"
x: 0
y: 1



[turret_2]
#"barrel"
x: 0.3
y: 42
image:M777_gun.png
attachedTo:1
slave:true

[projectile_1]
directDamage: 100
life: 240
speed: 35
frame: 8
areaDamage: 0
areaRadius: 0

[action_shell]
isVisible: if self.hasFlag(id=1) and not self.hasFlag(id=6)
text: HE-OR
text_ru: Осколочно-фугасный снаряд
description: Anti-personel
description_ru: Против живой силы противника
buildSpeed: 0
iconImage:ROOT:/PNG/155_HE_shell.png

[action_shell2]
isVisible: if self.hasFlag(id=2) and not self.hasFlag(id=6)
text: HEAT
text_ru: Кумулятивный снаряд
description: Anti-armor
description_ru:Против бронетехники
buildSpeed: 0
iconImage:ROOT:/PNG/155_MPHEAT_shell.png

[action_shell3]
isVisible: if self.hasFlag(id=3) and not self.hasFlag(id=6)
text: HE-Rocket
text_ru: Самонаводящийся снаряд
description: Anti-armor
description_ru:Против бронетехники
buildSpeed: 0
iconImage:ROOT:/PNG/155_Excalibur_shell.png

[hiddenAction_start]
autoTriggerOnEvent: created
addResources:155HE=8,155MPHEAT=4,155Excalibur=4,setFlag=1


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:155HE=1,155MPHEAT=1

[movement]
movementType: LAND
moveSpeed: 0.1
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.04

reverseSpeedPercentage: 0.6

maxTurnSpeed: 0.5
turnAcceleration: 0.03

moveSlidingMode :false
moveIgnoringBody:false
































