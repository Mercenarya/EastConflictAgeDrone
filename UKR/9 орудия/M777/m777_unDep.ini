image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[animation_in1]

arm1_11s: {dir:-170}
arm2_11s: {dir:170}


arm3_7s: {x:2, y:-2}
arm4_7s: {x:-1, y:-2} 

#arm1_1.400s: {x:10, y:-8}
#arm2_1.400s: {x:-9, y:5}

[action_activateShield]
