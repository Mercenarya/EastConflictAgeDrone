buildSpeed: 11s
pos: 0.1
whenBuilding_playAnimation: in1
text:Развертывание
disconnectFromParent:true

[arm_1]
x:9
y:11
image_end: leg_R.png
endDirOffset:-205

[arm_2]
x:-9
y:11
image_end: leg_L.png
endDirOffset:205

[arm_3]
x:9
y:-12
image_end: hand_R.png
endDirOffset:10
drawOverBody: true
[arm_4]
x:-9
y:-12
image_end: hand_L.png
endDirOffset:-10
drawOverBody: true


[attack]
