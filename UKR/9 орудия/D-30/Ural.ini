
[core]
#overrideAndReplace: tank
name: УРАЛТЯГ_укр
class: CustomUnitMetadata
price: 10000,Ammo=1700,Oil=2000
maxHp: 100
mass: 3000
armour:12
armourMinDamageToKeep:0
displayText: Ural (D-30)
displayText_ru: Урал-тягач (Д-30)
displayDescription: Main truck for transportation soldiers
displayDescription_ru: Oсновной грузовик для перевозки солдат

techLevel: 1
buildSpeed: 10s
#availableInDemo: true
fogOfWarSightRange: 8
radius: 30
displayRadius: 40
isBio: false
softCollisionOnAll: 3

energyMax: 7
energyRegen: 1
energyNeedsToRechargeToFull: true

transportSlotsNeeded: 25
maxTransportingUnits: 1
transportUnitsRequireTag:d30un
transportUnitsEachUnitAlwaysUsesSingleSlot:true

canRepairBuildings: false
canRepairUnits : false
autoRepair: false

selfRegenRate:0
nanoRange: 100
nanoBuildSpeed: 2.0
#soundOnMoveOrder:ROOT:/ogg/rf/URAL.OGG


[graphics]
total_frames: 1

image:        Ural.png
image_wreak:  Ural_dead.png
image_turret: none
scaleImagesTo:57

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true
imageScale: 0.5

[attack]

isMelee: false

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 20
turretTurnSpeed: 3


maxAttackRange: 182
shootDelay: 158

[turret_1]
#nano turret (nano must be slot 1)
x: 0
y: 6
invisible: true
warmup:30

canShoot: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false



[projectile_1]

directDamage: 1

life:400

speed: 3
targetSpeed: 5

trailEffect: true

largeHitEffect: true
frame: 4

[attachment_gun]
x: 0
y: -60
onCreateSpawnUnitOf:D30_move_ukr
addTransportedUnits:true
canBeAttackedAndDamaged: false
isUnselectable: false
keepAliveWhenParentDies:false
rotateWithParent:false
resetRotationWhenNotAttacking:true

[action_trigger_go]
autoTrigger:if self.isMoving()
temporarilyAddTags:move
isVisible:false

[action_trigger_notgo]
autoTrigger:if not self.isMoving()
temporarilyRemoveTags:move
isVisible:false

[movement]
movementType: LAND
moveSpeed: 1.3
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.05

maxTurnSpeed: 1
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false

[ai]
useAsBuilder: true


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=70

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=70) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=1



























