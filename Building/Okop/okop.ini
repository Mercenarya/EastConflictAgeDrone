[core]
name: okop
maxHp:100
mass:30
price:100
radius:5
isBuilding:true
footprint:0, 0, 0, 0
constructionFootprint:0, 0, 0, 0
copyFrom:okop.template
tags:oLR, okop,defend
maxTransportingUnits:2
#transportUnitsRequireTag:human

buildSpeed:10s
[graphics]
image:okopNull.png
image_back:okop.png
image_offsetX:0
image_offsetY:100
showTransportBar:false
[attack]
canAttack:false

[movement]
movementType: building
targetHeight: -0.1

[ai]
disableUse:true


[arm_9]
x:0
y:4
image_end:oTw.png
hidden:if numberOfUnitsInNeutralTeam(withTag="bottom", greaterThan=0, withinRange=10)
drawOverBody:true
alpha:0.5

[arm_11]
x:-4
y:0
image_end:oLw.png
drawOverBody:true
hidden:if numberOfUnitsInNeutralTeam(withTag="right", greaterThan=0, withinRange=10)


[arm_12]
x:4
y:0
image_end:oRw.png
drawOverBody:true
hidden:if numberOfUnitsInNeutralTeam(withTag="left", greaterThan=0, withinRange=10)

[arm_13]
x:0
y:-4
image_end:oBw.png
drawOverBody:true
hidden:if numberOfUnitsInNeutralTeam(withTag="top", greaterThan=0, withinRange=10)


[action_defend1]
isVisible:false
autoTrigger: if self.transportingUnitWithTags(includes='infantry')
temporarilyAddTags: okopdefend



[action_defend2]
isVisible:false
autoTrigger: if not self.transportingUnitWithTags(includes='infantry')
temporarilyRemoveTags: okopdefend





