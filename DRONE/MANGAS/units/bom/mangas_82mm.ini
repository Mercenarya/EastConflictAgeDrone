canAttackFlyingUnits: true
canAttackLandUnits: false
canAttackUnderwaterUnits: false

attackMovement: bomber

turretSize: 20
turretTurnSpeed: 60

aimOffsetSpread: 0
maxAttackRange: 510
shootDelay: 100

[movement]
movementType: AIR
moveSpeed: 0
moveAccelerationSpeed: 0.015
moveDecelerationSpeed: 0.015

maxTurnSpeed: 1.35
turnAcceleration: 0.06

moveSlidingMode: false
moveIgnoringBody: false
moveSlidingDir: 25

reverseSpeedPercentage: 0
slowDeathFall: true

[action_Grenade]
fireTurretXAtGround: AP
fireTurretXAtGround_withOffset: 0,0

text: Drop 82mm mine
text_ru: Сброс 82мм мины
addActionCooldownTime: 0.35s
description: Drop high-explosive 82mm mortar bomb (x1.5 damage & radius)
description_ru: Сброс усиленной 82мм осколочно-фугасной мины (урон и радиус x1.5)
displayType: action
buildSpeed: 0.2s
pos: 0.1
resetCustomTimer: true
price: mangas_mines=1

[turret_AP]
x: 0
y: 0
projectile: APphase
size: 1
turnSpeedAcceleration: 0.5
canShoot: false
recoilOffset: 0
image: images/mina.png
limitingRange: 20
invisible: true

[projectile_APphase]
