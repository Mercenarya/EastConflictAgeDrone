[resource_mangas_mines]
displayName: 82mm Mines

[graphics]
showHealthBar: true
showEnergyBar: true
icon_zoomed_out_neverShow: true
total_frames: 1

image: images/null.png
image_wreak: none
image_turret: none
teamColorsOnTurret: true
scaleImagesTo: 0.15

image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1

[attack]
