[core]
showInEditor: false
name: Mangas_82mm
displayText: 82mm mines (Mangas)
displayText_ru: 82мм Мины (Мангас)
displayDescription: 6x heavy 82mm HE mortar bombs with cluster HEAT fragments
displayDescription_ru: 6 штук усиленных 82мм фугасных минометных мин для БПЛА Мангас

tags: rf,AT,rocket
class: CustomUnitMetadata
price: 1
maxHp: 100
armour: 100
armourMinDamageToKeep: 0
mass: 30000

techLevel: 1

transportSlotsNeeded: 1
radius: 8
