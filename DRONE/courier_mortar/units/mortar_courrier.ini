[core]
name: Mortar Courier
displayText: Kurier "Mortar 82mm"
displayText_ru: Курьер "Миномет 82мм"
displayDescription: - Russian robotic tracked complex Kurier\n- Armed with 82mm mortar (2B14 Podnos mechanism)\n- Max ammunition: 25 rounds\n- Supports Single Shot and 5-Round Burst fire modes
displayDescription_ru: - Российский гусеничный робот "Курьер"\n- Оснащен 82-мм минометом (баллистика и механизм 2Б14 "Поднос")\n- Ограниченный боезапас: 25 мин\n- Режимы стрельбы: Одиночный и Очередь (5 мин)
class: CustomUnitMetadata
mass: 280
price: 600, Ammo=150
maxHp: 400
techLevel: 2
radius: 9
buildSpeed: 7s
isBio: false
fogOfWarSightRange: 16

energyMax: 100
energyRegen: 0.25
energyNeedsToRechargeToFull: true

[resource_81mortarHE]
displayName: 82mm Mortar Shells

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: 81mortarHE=25, setFlag=1

[hiddenAction_ammoReload]
autoTrigger: if numberOfUnitsInTeam(withTag='Ammo', withinRange=100, greaterThan=0) and self.resource(type='81mortarHE', lessThan=25) and self.queueSize(lessThan=1)
alsoQueueAction: LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources: 81mortarHE=1

[hiddenAction_startReload]
buildSpeed: 0.25s
addResources: setFlag=2
spawnEffects: CUSTOM:reloadSound
alsoQueueAction: finishReload

[hiddenAction_finishReload]
buildSpeed: 1.6s
addResources: unsetFlag=2

[effect_reloadSound]
life: 30
priority: high
alsoPlaySound: ROOT:/OGG/rf/reload.ogg:0.75

[action_ammo1]
isLocked: true
isVisible: if self.resource(type='81mortarHE', greaterThan=0)
text: ammo
text_ru: Боезапас
description: Remaining 82mm mortar shells (max 25)
description_ru: Сколько осталось боезапаса (макс 25)
iconImage: ROOT:/PNG/Ammunition.png
addResources: 81mortarHE=1
price: 81mortarHE=1
buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile

[action_Single]
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile: mortar
text: Одиночный выстрел
text_ru: Одиночный выстрел
description: Single 82mm mortar shell
description_ru: Одиночный выстрел 82-мм миной
displayType: action
buildSpeed: 5s
fireTurretXAtGround_count: 1
isLocked: if not self.customTimer(laterThanSeconds=10)
resetCustomTimer: true
isVisible: if self.hasFlag(id=1) and self.resource(type='81mortarHE', greaterThan=0)
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: mortar
whenBuilding_rotateTo_waitTillRotated: true
price: 81mortarHE=1
iconImage: ROOT:/PNG/Ammunition.png
pos: 0.2

[action_Burst]
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile: mortar
text: Выстрел очередью (5 мин)
text_ru: Выстрел очередью (5 мин)
description: 5-round mortar salvo
description_ru: Залп из 5 мин
displayType: action
buildSpeed: 5s
fireTurretXAtGround_count: 1
isLocked: if not self.customTimer(laterThanSeconds=20)
resetCustomTimer: true
isVisible: if self.hasFlag(id=1) and self.resource(type='81mortarHE', greaterThan=4)
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: mortar
whenBuilding_rotateTo_waitTillRotated: true
price: 81mortarHE=5
alsoQueueAction: Cor2
iconImage: ROOT:/PNG/Ammunition.png
pos: 0.3

[action_Cor2]
isVisible: false
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile: mortar
displayType: action
buildSpeed: 3s
fireTurretXAtGround_count: 1
isLocked: if not self.customTimer(laterThanSeconds=10)
resetCustomTimer: true
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: mortar
whenBuilding_rotateTo_waitTillRotated: true
alsoQueueAction: Cor3

[action_Cor3]
isVisible: false
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile: mortar
displayType: action
buildSpeed: 3s
fireTurretXAtGround_count: 1
isLocked: if not self.customTimer(laterThanSeconds=10)
resetCustomTimer: true
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: mortar
whenBuilding_rotateTo_waitTillRotated: true
alsoQueueAction: Cor4

[action_Cor4]
isVisible: false
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile: mortar
displayType: action
buildSpeed: 3s
fireTurretXAtGround_count: 1
isLocked: if not self.customTimer(laterThanSeconds=10)
resetCustomTimer: true
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: mortar
whenBuilding_rotateTo_waitTillRotated: true
alsoQueueAction: Cor5

[action_Cor5]
isVisible: false
fireTurretXAtGround: mortar
fireTurretXAtGround_withProjectile: mortar
displayType: action
buildSpeed: 3s
fireTurretXAtGround_count: 1
isLocked: if not self.customTimer(laterThanSeconds=10)
resetCustomTimer: true
whenBuilding_rotateTo_aimAtActionTarget: true
whenBuilding_rotateTo_rotateTurretX: mortar
whenBuilding_rotateTo_waitTillRotated: true

[graphics]
image: images/kurrier.png
imageScale: 0.51
total_frames: 1
scaleImagesTo: 33
scaleTurretImagesTo: 0.9
image_turret: images/null.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
dustEffect: true

[movement]
movementType: LAND
moveSpeed: 0.85
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.12
maxTurnSpeed: 2.0
turnAcceleration: 0.2

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 18
turretTurnSpeed: 1.4
maxAttackRange: 1000
shootDelay: 10

[turret_mortar]
#82mm mortar mount matching original Kurier turret pixel art style
x: 0
y: 0
energyUsage: 100
canShoot: true
shoot_sound: ROOT:/ogg/amer/Mortar.OGG
shoot_sound_vol: 0.25
shoot_flame: NONE
shoot_light: #FFEECCCC
warmup: 1s
shouldResetTurret: false
resourceUsage: 81mortarHE=1
projectile: mortar
delay: 3s
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
canAttackCondition: if self.resource(type='81mortarHE', greaterThan=0)
turnSpeedAcceleration: 1.0
turnSpeed: 1.5
image: images/Kurier_turret_mortar.png
barrelX: 0
barrelY: 22
recoilOffset: -3
recoilOutTime: 3
recoilReturnTime: 12
onShoot_triggerActions: startReload
invisible: if self.hasFlag(id=2)

[turret_mortar_loading]
x: 0
y: 0
attachedTo: mortar
slave: true
canShoot: false
image: images/Kurier_turret_mortar_load.png
invisible: if not self.hasFlag(id=2)
barrelX: 0
barrelY: 22

[projectile_mortar]
areaDamage: 700
areaRadius: 39
largeHitEffect: true
life: 600
speed: 2
image: ROOT:/PNG/81M_HE.png
drawSize: 0.3
initialUnguidedSpeedHeight: 0.5
trailEffect: false
tags: HE
turnSpeed: 0.7
explodeOnEndOfLife: true
friendlyFire: true
buildingDamageMultiplier: 4
targetGround: true
targetGroundSpread: 95
mutator1_ifUnitWithTags: ARMOR
mutator1_areaDamageMultiplier: 0.3
explodeEffect: CUSTOM:pyro*6, CUSTOM:projectileSound, CUSTOM:projectileGroundSmoke*4, CUSTOM:projectileGroundSplash*3, CUSTOM:projectileWaterSmoke*2, CUSTOM:projectileWaterSplash*3, CUSTOM:projectileFlash, CUSTOM:projectileCrater
spawnProjectilesOnExplode: HEAT_Component*25

[projectile_HEAT_Component]
tags: HEAT
directDamage: 30
life: 700
speed: 7.5
areaDamage: 90
areaRadius: 20
armourIgnoreAmount: 10
areaExpandTime: 0
friendlyFire: true
targetGround: true
targetGroundSpread: 80
explodeOnEndOfLife: true
