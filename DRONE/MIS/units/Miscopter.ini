[core]
name=MIS Copter
displayText: MIS Heavy Bomber Copter
displayDescription: - Heavy multicopter bomber drone \n- Drops 81mm/82mm HE mortar bombs
radius=7
mass=18
price=240
maxHp=80
energyMax:4500
energyRegen:-0.2
maxTransportingUnits: 2
transportUnitsRequireMovementType: LAND
isBio: false
fogOfWarSightRange: 18
buildSpeed: 4s

[graphics]
image=images/Z113.png
total_frames: 1
imageScale: 0.27
image_turret: vint.png
scaleTurretImagesTo: 15
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2

[attachment_aircraft]
x: 0
y: 10
isUnselectable: true

resetRotationWhenNotAttacking: true
idleDir: 0
height: 10
setDrawLayerOnBottom: false
deattachIfWantingToMove: true
canBeAttackedAndDamaged: true


[movement]
movementType=AIR

moveSpeed: 1.4
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.03
#landOnGround:true

maxTurnSpeed: 1.10
turnAcceleration: 0.03


moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  1


[turret_1]
x:10
y:12
canAttack:false
idleSpin:50

[turret_2]
x:-10
y:12
canAttack:false
idleSpin:-50


[turret_3]
x:10
y:-10
canAttack:false
idleSpin:50

[turret_4]
x:-10
y:-10
canAttack:false
idleSpin:-50



[attack]
canAttack=false
canAttackFlyingUnits: true
canAttackLandUnits: false

attackMovement: bomber

turretSize: 20
turretTurnSpeed: 40
aimOffsetSpread: 0
shootDelay: 100


[action_dropbullets]
fireTurretXAtGround:Bullets
fireTurretXAtGround_withOffset:0,0

text: Thow bomber
displayType: action
buildSpeed: 0.7s
pos: 0.1
resetCustomTimer:true

[turret_Bullets]
x: 0
y: 0
projectile: Bombs
size: 1
turnSpeedAcceleration: 0.5
canShoot: false
recoilOffset: 0
image:81M_HE.png
limitingRange: 20
invisible: true

[projectile_Bombs]
tags:Bombs
image:81M_HE.png
drawSize: 0.3
directDamage: 10
areaDamage: 700
areaRadius: 39
life: 300
speed:0.5

friendlyFire: true
explodeOnEndOfLife:true
buildingDamageMultiplier: 4
lightCastOnGround: true
wobbleAmplitude:0.02
wobbleFrequency:1
explodeEffect:CUSTOM:pyro*6, CUSTOM:projectileGroundSmokee*2
armourIgnoreAmount:200



[effect_pyro]
spawnChance:0.5
life:60
alpha:0
alsoEmitEffects:CUSTOM:sparks*9,CUSTOM:sparks2*7, smoke

[effect_sparks]
attachedToUnit: false
life: 150
scaleFrom:1
scaleTo: 3
physics: true
xSpeedRelativeRandom: 0.6
ySpeedRelativeRandom: 0.6
hSpeed: 1
image:spark.png
priority: low

[effect_sparks2]
attachedToUnit: false
life: 150
scaleFrom:1
scaleTo: 3
physics: true
xSpeedRelativeRandom: 1.5
ySpeedRelativeRandom: 1.5
hSpeed: 1
image:spark.png
priority: low

[effect_projectileGroundSmokee]
priority:veryhigh

stripIndex: effects
frameIndex: 0

createWhenOverLiquid: false
life: 100
fadeOut: true
attachedToUnit: false
color: #6D5448
fadeInTime:5
scaleFrom: 0.5
scaleTo: 1
alpha: 1.25
drawUnderUnits:false
hSpeed:0.2
hOffsetRandom:0.15

dirOffsetRandom:180

shadow:true
xOffsetRelativeRandom: 24
yOffsetRelativeRandom: 24
xSpeedAbsoluteRandom:0.2
ySpeedAbsoluteRandom:0.2
atmospheric: true


[action_landing]
text: Landing mode
description: Switch to Landing mode.
autoTrigger: false
convertTo: MIS Landed




