[core]
name: RPO Courier
displayText: Kurier "RPO Shmel"
displayText_ru: Курьер "РПО Шмель x6"
displayDescription: - Russian robotic tracked complex Kurier\n- Armed with 6x RPO-A Shmel thermobaric rocket launchers\n- Carries max 6 tubes; reloads between shots matching RPO infantry
displayDescription_ru: - Российский гусеничный робот "Курьер"\n- Вооружен блоком из 6 реактивных пехотных огнеметов РПО-А "Шмель"\n- Боекомплект 6 труб, перезарядка и урон аналогичны гранатометчику РПО
class: CustomUnitMetadata
mass: 260
price: 550
maxHp: 400
techLevel: 2
radius: 9
buildSpeed: 6s
isBio: false
fogOfWarSightRange: 16

energyMax: 50
energyRegen: 0.15
energyNeedsToRechargeToFull: true

[graphics]
image: images/kurrier.png
imageScale: 0.51
total_frames: 1
scaleImagesTo: 33
scaleTurretImagesTo: 0.9
image_turret: images/null.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
dustEffect: true

[movement]
movementType: LAND
moveSpeed: 0.9

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 1.4
maxAttackRange: 450
shootDelay: 50
aimOffsetSpread: 0.8

[turret_rpo]
#x6 RPO Shmel launcher rack
x: 0
y: 0
shouldResetTurret: false
projectile: 1
image: images/Kurier_turret_rpo6.png
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turnSpeedAcceleration: 1.0
warmup: 5
resourceUsage: rpgof=1
energyUsage: 50
shoot_sound: ROOT:/ogg/rf/rpg7.OGG
shoot_sound_vol: 0.75
shoot_flame: CUSTOM:glow,CUSTOM:glow2,CUSTOM:shell
shoot_light: #ffff4900
recoilOffset: 0
canShoot: true
barrelX: 0
barrelY: 12

[projectile_1]
directDamage: 1
life: 300
speed: 8
frame: 1
image: ROOT:/PNG/Infantry/Rpg22_shell.png
drawSize: 0.5
targetGround: true
targetGroundSpread: 7
areaRadius: 20
areaDamage: 2000
explodeEffect: CUSTOM:lostShot
trailEffect: CUSTOM:projectileTrail
trailEffectRate: 1
tags: rpg,HEI
armourIgnoreAmount: 200
spawnUnit: fire

[effect_glow]
xOffsetRelative: 1
attachedToUnit: false
life: 8
alpha: 2
image: ROOT:/PNG/Infantry/glow.png
priority: high
drawUnderUnits: false
scaleFrom: 0
scaleTo: 1.8

[effect_glow2]
xOffsetRelative: 1
attachedToUnit: false
life: 8
alpha: 2
image: ROOT:/PNG/Infantry/glow2.png
priority: high
drawUnderUnits: false
scaleFrom: 0.2
scaleTo: 0.6

[effect_shell]
xOffsetRelative: 2
yOffsetRelative: -10
attachedToUnit: false
life: 300
physics: true
xSpeedRelative: 0.3
xSpeedRelativeRandom: 0.3
ySpeedRelativeRandom: 0.3
hSpeed: 1.2
image: ROOT:/PNG/Infantry/rpg22.png
priority: low
drawUnderUnits: true
scaleFrom: 0.3
scaleTo: 0.3
dirSpeedRandom: 20

[effect_lostShot]
spawnChance: 0.01
attachedToUnit: false
life: 60
ySpeedRelative: 6
image: ROOT:/PNG/Infantry/Rpg22_shell.png
scaleFrom: 0.15
scaleTo: 0.15
priority: low

[effect_projectileTrail]
priority: critical
stripIndex: effects
frameIndex: 0
life: 75
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime: 1.5
scaleFrom: 0.2
scaleTo: 0.3
alpha: 0.5
drawUnderUnits: false
atmospheric: true
shadow: true
yOffsetRelative: -10
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: rpgof=6

[hiddenAction_ammoReload]
autoTrigger: if numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.resource(type='rpgof',lessThan=6) and self.queueSize(lessThan=1)
alsoQueueAction: LoadRPO

[hiddenAction_LoadRPO]
buildSpeed: 3s
addResources: rpgof=1

[action_rpo_stock]
isLocked: true
text: RPO Shmel Tubes
text_ru: Трубы РПО Шмель
description: Remaining RPO-A Shmel launcher tubes (max 6)
description_ru: Остаток выстрелов РПО-А Шмель (макс. 6)
addResources: rpgof=1
price: rpgof=1
buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile

