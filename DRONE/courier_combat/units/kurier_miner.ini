# ============================================================
#  Kurier Mine Layer – UGV robotic AT mine-laying platform
#  Uses Kurier_mine.png sprite + TM-62 anti-tank mine payload
#  Mechanic mirrors the infantry AT Miner unit (canBuild Tm62)
# ============================================================

[core]
name: kurier_miner
class: CustomUnitMetadata
displayText:  Kurier Mine Layer
displayText_ru: Курьер Минёр
displayDescription: - Unmanned ground vehicle based on Kurier chassis \\n- Carries TM-62 anti-tank mines \\n- Lays mines autonomously; limit 8 mines per deploy \\n- Slow-moving; no onboard weapon
displayDescription_ru: - Беспилотная наземная платформа на базе «Курьер» \\n- Несёт противотанковые мины ТМ-62 \\n- Раскладывает мины автономно; до 8 мин за выход \\n- Малая скорость; вооружения нет

price:   520
maxHp:   280
mass:    280
armour:  20
armourMinDamageToKeep: 0

techLevel:   2
buildSpeed:  10s

fogOfWarSightRange: 12
radius: 9
displayRadius: 9

isBio: false
hideScorchMark: false
softCollisionOnAll: 0
tags: ugv, robot

isBuilder: true
canRepairUnits: true
autoRepair: false
nanoRangeForRepairIsMelee: true
nanoRepairSpeed: 0.2
nanoRange: 20

energyMax: 30
energyRegen: 0.2
energyNeedsToRechargeToFull: true

effectOnDeath: CUSTOM:explode_ugv


# ─── BUILD PAYLOAD (Mirrors Miner AT RF) ───────────────────
[canBuild_2]
name: Tm62
pos:  1
forceNano: true


# ─── GRAPHICS ──────────────────────────────────────────────
[graphics]
total_frames: 1

image:        images/Kurier_mine.png
image_turret: NONE
image_wreak:  NONE
imageScale:   0.51
scaleImagesTo: 33

image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1

dustEffect: true

rotate_with_direction: true


# ─── MOVEMENT ──────────────────────────────────────────────
[movement]
movementType: LAND
moveSpeed:    0.55
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.10

maxTurnSpeed:    2.5
turnAcceleration: 2

moveSlidingMode: false
moveIgnoringBody: false


# ─── ATTACK (none – this unit only lays mines) ─────────────
[attack]
canAttack: false


# ─── DEATH EFFECTS ─────────────────────────────────────────
[effect_explode_ugv]
priority: critical
alsoEmitEffects: CUSTOM:ugv_fire*4, CUSTOM:ugv_smoke*6, CUSTOM:ugv_sparks*10

[effect_ugv_fire]
priority: critical
image: PNG/boom2.png
total_frames: 10
animateFrameStart: 0
animateFrameEnd: 9
animateFrameSpeed: 0.25
attachedToUnit: false
life: 320
scaleFrom: 0.9
scaleTo: 1.4
alpha: 1.4
dirOffsetRandom: 180

[effect_ugv_smoke]
priority: veryhigh
stripIndex: effects
frameIndex: 0
createWhenOverLiquid: false
life: 450
fadeOut: true
attachedToUnit: false
color: #5A4030
fadeInTime: 8
scaleFrom: 1.5
scaleTo: 4.5
alpha: 1.3
drawUnderUnits: false
hSpeed: 0.25
hOffsetRandom: 0.2
dirOffsetRandom: 180
shadow: true
xOffsetRelativeRandom: 20
yOffsetRelativeRandom: 20
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2
atmospheric: true

[effect_ugv_sparks]
attachedToUnit: false
life: 160
scaleFrom: 1
scaleTo: 3
physics: true
xSpeedRelativeRandom: 0.9
ySpeedRelativeRandom: 0.9
hSpeed: 1.1
image: PNG/spark.png
priority: low

