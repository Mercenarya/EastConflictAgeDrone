[core]
name= Combat Courier
displayText: Kurier "12.7mm"
displayDescription: - Russian robotic tracked complex Kurier \n- Armed with 12.7mm Kord heavy machine gun \n- Light ballistic and splinter protection
mass= 250
price= 420
maxHp= 420
techLevel: 2
radius= 9
buildSpeed: 6s
isBio: false
fogOfWarSightRange: 15




[graphics]
image=images/kurrier.png

imageScale: 0.51
total_frames: 1
scaleImagesTo:33
scaleTurretImagesTo: 0.9
image_turret: images/null.png
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true


[movement]
movementType= LAND
moveSpeed: 0.95


[attack]
canAttack=true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 20
turretTurnSpeed: 1.4
maxAttackRange: 280
shootDelay: 0




[turret_stvol]
#kord
x: 0
y: 0
shouldResetTurret: false
canShoot: true
shoot_sound: ogg/50cal_new.ogg
shoot_sound_vol: 0.15

shoot_light:#FFEECCCC
delay:0.17s
canAttackLandUnits:   true
canAttackFlyingUnits: false
projectile:kord
image:images/Kurier_turret_2.png

barrelX: 0
barrelY: 4
limitingRange:280
shoot_flame:CUSTOM:porohgaz*1,CUSTOM:porohgaz1*1


[projectile_kord]
directDamage: 50
life: 100
speed: 8
image: PNG/20_AVIA.png
drawSize: 0.4
largeHitEffect: true
armourIgnoreAmount:30
deflectionPower: 3
buildingDamageMultiplier: 4
