[core]
name=Kursir
displayText: Kursir Quadcopter
displayDescription: - Tactical reconnaissance quadcopter \n- Can carry light payloads
radius=7
mass=4
price=90
maxHp=35
energyMax:4000
energyRegen:-0.2
isBio: false
fogOfWarSightRange: 20
buildSpeed: 3s
maxTransportingUnits: 2
transportUnitsRequireMovementType: LAND


[graphics]
image=images/quadcopter_kursir_2.png
total_frames: 1
imageScale: 0.051
image_turret: vint.png
scaleTurretImagesTo: 15
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2

[attachment_aircraft]
x: 0
y: 10
isUnselectable: true

resetRotationWhenNotAttacking: true
idleDir: 0
height: 10
setDrawLayerOnBottom: false
deattachIfWantingToMove: true
canBeAttackedAndDamaged: true


[movement]
movementType=AIR

moveSpeed: 2.2
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.03
#landOnGround:true

maxTurnSpeed: 1.10
turnAcceleration: 0.03


moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  1


[turret_1]
x:9
y:10
canAttack:false
idleSpin:50

[turret_2]
x:-9
y:10
canAttack:false
idleSpin:50


[turret_3]
x:9
y:-10
canAttack:false
idleSpin:50

[turret_4]
x:-9
y:-10
canAttack:false
idleSpin:50



[attack]
canAttack=false
