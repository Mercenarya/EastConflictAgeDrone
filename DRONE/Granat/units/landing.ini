[core]
name=Landed UAV "Granat-E"
displayText: Landed UAV Granat-E
displayDescription: - Reconnaissance drone landed on ground to recharge battery
radius=7
mass=4
price=120
maxHp=45
energyMax:4000
energyRegen:2
isBio: false
fogOfWarSightRange: 12
buildSpeed: 3s


[graphics]
image=images/bpla2.png
total_frames: 2
imageScale: 0.4
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 1
image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2




[attachment_aircraft]
x: 0
y: 0
isUnselectable: true
addTransportedUnits: true
resetRotationWhenNotAttacking: true
idleDir: 0
height: 0
setDrawLayerOnBottom: false
deattachIfWantingToMove: true
canBeAttackedAndDamaged: true


[movement]
movementType: LAND
moveSpeed: 0.5

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
turretSize: 11
turretTurnSpeed: 0.6
maxAttackRange: 1500
shootDelay: 5s
turretMultiTargeting: true
disablePassiveTargeting:true
stopTargetingAfterFiring:true



[effect_trail] 
life: 40
image: images/Trail.png 
color: #CCCCDD 
 
priority: verylow 
 
attachedToUnit: false 
atmospheric: true 
physics: false 
physicsGravity: 0 
 
xOffsetRelative: 12
yOffsetRelative: -4
xSpeedRelative: 0 
ySpeedRelative: 0 
 
scaleFrom: 0.2
scaleTo: 0.2
 
alpha: 0.75 
 
 
[effect_trail2] 
life: 40
image: images/Trail.png 
color: #CCCCDD 
 
priority: verylow 
 
attachedToUnit: false 
atmospheric: true 
physics: false 
physicsGravity: 0 
 
xOffsetRelative: -12
yOffsetRelative: -4
xSpeedRelative: 0 
ySpeedRelative: 0 
 
scaleFrom: 0.2
scaleTo: 0.2
 
alpha: 0.75 


[action_Laser]
fireTurretXAtGround:69
fireTurretXAtGround_withProjectile:laser
text: Highlight the target
text_ru: Подсветить цель
displayType: action
buildSpeed: 1s
fireTurretXAtGround_count:1
isLocked:if self.queueSize(greaterThan=0)
addActionCooldownTime: 5s

[turret_69]
x: 0
y: 0
canShoot: false
canAttackCondition:if not self.isMoving()
limitingAngle:1500
projectile: laser

[projectile_laser]
directDamage: 0
life: 100
frame: 4
speed: 1000
drawSize: 0.001
spawnUnit: Laser*1
explodeEffect:none

[action_takeoff]
text: Fly mode
description: Switch to Landing mode.
autoTrigger: false
convertTo: UAV "Granat-E"