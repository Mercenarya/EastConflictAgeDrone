[core]
showInEditor: false
name: VTOL_UKR Surveillance
displayText: Tactical VTOL UAV (UA Surveillance)
displayText_ru: Тактический БПЛА СВВП (ЗСУ) [Патруль]
displayDescription: - High-altitude aerial surveillance & reconnaissance patrol mode (AFU) \n- Extended optical sight range (34) and laser target designation
displayDescription_ru: - Режим высотного разведывательного патрулирования ЗСУ \n- Расширенный обзор (34) и лазерный целеуказатель
radius: 7
mass: 8
price: 180
maxHp: 65
energyMax: 4500
energyRegen: -0.15
isBio: false
fogOfWarSightRange: 34
buildSpeed: 4s
maxTransportingUnits: 2
transportUnitsRequireMovementType: AIR

[graphics]
image: images/vtol_ukr.png
total_frames: 2
imageScale: 0.20
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 1
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2
image_turret: images/vint.png
scaleTurretImagesTo: 6.0
movementEffect: CUSTOM:trail, CUSTOM:trail2
movementEffectRate: 2

[effect_trail]
life: 32
image: images/trail.png
color: #DCE8F6
priority: verylow
attachedToUnit: false
atmospheric: true
physics: false
physicsGravity: 0
xOffsetRelative: 13
yOffsetRelative: -1
xSpeedRelative: 0
ySpeedRelative: 0
scaleFrom: 0.16
scaleTo: 0.10
alpha: 0.6

[effect_trail2]
life: 32
image: images/trail.png
color: #DCE8F6
priority: verylow
attachedToUnit: false
atmospheric: true
physics: false
physicsGravity: 0
xOffsetRelative: -13
yOffsetRelative: -1
xSpeedRelative: 0
ySpeedRelative: 0
scaleFrom: 0.16
scaleTo: 0.10
alpha: 0.6

[attachment_aircraft]
x: 0
y: 8.4
isUnselectable: true
addTransportedUnits: true
resetRotationWhenNotAttacking: true
idleDir: 0
height: 0
setDrawLayerOnBottom: false
deattachIfWantingToMove: true
canBeAttackedAndDamaged: true

[movement]
movementType: AIR
moveSpeed: 1.5
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.02
targetHeight: 120
targetHeightDrift: 0.5
maxTurnSpeed: 2.6
turnAcceleration: 0.06
moveSlidingMode: false
moveIgnoringBody: false
moveSlidingDir: 25

[turret_1]
x: 4.9
y: 10.5
canAttack: false
idleSpin: 50

[turret_2]
x: -4.9
y: 10.5
canAttack: false
idleSpin: -50

[turret_3]
x: 4.9
y: -7.3
canAttack: false
idleSpin: -50

[turret_4]
x: -4.9
y: -7.3
canAttack: false
idleSpin: 50

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 11
turretTurnSpeed: 0.6
maxAttackRange: 1500
shootDelay: 5s
turretMultiTargeting: true
disablePassiveTargeting: true
stopTargetingAfterFiring: true

[action_Laser]
fireTurretXAtGround: 69
fireTurretXAtGround_withProjectile: laser
text: Highlight the target
text_ru: Подсветить цель
displayType: action
buildSpeed: 1s
pos: 0.1
fireTurretXAtGround_count: 1
isLocked: if self.queueSize(greaterThan=0)
addActionCooldownTime: 5s

[turret_69]
x: 0
y: 0
canShoot: false
canAttackCondition: if not self.isMoving()
limitingAngle: 1500
projectile: laser

[projectile_laser]
directDamage: 0
life: 100
frame: 4
speed: 1000
drawSize: 0.001
spawnUnit: Laser*1
explodeEffect: none

[action_transit]
text: Transit Mode
text_ru: Полетный режим
description: Switch back to fast transit flight mode.
description_ru: Возврат в скоростной полетный режим.
displayType: action
buildSpeed: 1.5s
pos: 0.2
autoTrigger: false
convertTo: VTOL_UKR

[action_landing]
text: Landing mode
text_ru: Посадка
description: Switch to Landing mode.
description_ru: Переход в режим посадки.
pos: 0.3
autoTrigger: false
convertTo: VTOL_UKR Landed

