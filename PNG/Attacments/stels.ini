[core]
showInEditor: false
name: stels_su57
#overrideAndReplace
displayText: стелс бля
displayDescription_ru: Блок Л-370-3С , производит постановку помех для приближающихся к самолёту ракет , мешая их наведению на цель.
displayDescription:  Block L-370-3C, interferes with missiles approaching the aircraft, preventing their targeting.
