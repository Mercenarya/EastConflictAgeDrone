y: 0

projectile:1
shoot_sound:ROOT:/ogg/rf/Igla.ogg
shoot_sound_vol:0.5
resourceUsage:ammo=1
limitingAngle:20
warmup:1s
delay:9s

canOnlyAttackUnitsWithTags:armor
