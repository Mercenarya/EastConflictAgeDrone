[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false



[hiddenAction_ammoReload1]
autoTrigger: if self.ammo(lessThan=1) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 25s
addResources:ammo=4


[action_notFire]

setUnitStats: maxAttackRange=1

text:Not Fire
text_ru: Запретить огонь
isVisible: if not self.hasFlag(id=1)
addResources: setFlag=1
buildSpeed: 0s

[action_Fire]

setUnitStats: maxAttackRange=740

text:Fire
text_ru: Разрешить огонь
isVisible: if self.hasFlag(id=1)
addResources: unsetFlag=1
buildSpeed: 0s








































