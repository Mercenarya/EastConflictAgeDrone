largeHitEffect: true
life: 200
speed:5.2

retargetingInFlight:true
retargetingInFlightSearchDelay:5
retargetingInFlightSearchRange:30
retargetingInFlightSearchOnlyTags:FalseTarget


lightColor:#d2ff00
lightSize:0.8

image:ROOT:/PNG/Projectiles/ataka.png
