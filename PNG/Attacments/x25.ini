canAttackUnderwaterUnits: false

turretSize: 1
turretTurnSpeed: 10

maxAttackRange: 1430
shootDelay: 1




[turret_MainGun]
x: 0
y: 0

projectile:1
shoot_sound:ROOT:/ogg/rf/Igla.ogg
shoot_sound_vol:0.5
resourceUsage:ammo=1
limitingAngle:20
warmup:1s
delay:7s

canOnlyAttackUnitsWithTags:radar,armor,noarmor
invisible:true



[projectile_1]
#X25
#heat
directDamage: 2000
armourIgnoreAmount:500
areaDamage: 800
shieldDamageMultiplier:3
areaRadius: 23
largeHitEffect: true
life: 420
speed:7.1

image:ROOT:/PNG/Projectiles/x25MPU.png
drawSize:0.5


explodeEffect:CUSTOM:pyro,shockwave,smallExplosion
trailEffect:true
tags:x25,AntiRadar,AGM

turnSpeed:0.9
explodeOnEndOfLife:true
friendlyFire:true
initialUnguidedSpeedHeight: 1.2
gravity:0.18



[effect_pyro]
spawnChance:1
life:60
alpha:0
alsoEmitEffects:CUSTOM:sparks*6,CUSTOM:sparks2*4, smoke

[effect_sparks]
attachedToUnit: false
life: 150
scaleFrom:1
scaleTo: 0.4
physics: true
xSpeedRelativeRandom: 1
ySpeedRelativeRandom: 1
hSpeed: 1
priority: low

[effect_sparks2]
attachedToUnit: false
life: 150
scaleFrom:1.6
scaleTo: 0.3
physics: true
xSpeedRelativeRandom: 2
ySpeedRelativeRandom: 2
hSpeed: 1
priority: low



[arm_1]
x:0
y:0
hidden:if self.ammo(lessThan=1)
image_end:ROOT:/PNG/Projectiles/x25MPU.png
lockMovement:true






[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false



[hiddenAction_ammoReload1]
autoTrigger: if self.ammo(lessThan=1) and self.queueSize(lessThan=1) and self.numberOfUnitsInTeam(withTag='zapravka',greaterThan=0,withinRange=100)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 35s
addResources:ammo=1

[action_notFire]

setUnitStats: maxAttackRange=1

text:Not Fire
text_ru: Запретить огонь
isVisible: if not self.hasFlag(id=1)
addResources: setFlag=1
buildSpeed: 0s

[action_Fire]

setUnitStats: maxAttackRange=650

text:Fire
text_ru: Разрешить огонь
isVisible: if self.hasFlag(id=1)
addResources: unsetFlag=1
buildSpeed: 0s












































