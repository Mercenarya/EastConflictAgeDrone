
[core]
showInEditor: false
name: x25
#overrideAndReplace
displayText: X-25МПУ
displayDescription_ru:     Противорадиолокационная ракета, предназначенная для уничтожения радаров противника. Масса ВВ 90кг.
displayDescription:     An anti-radar missile designed to destroy enemy radars. The mass of explosives is 90 kg.

tags:rf,ATR,rocket
class: CustomUnitMetadata
price: 1
maxHp: 100
armour:100
armourMinDamageToKeep:0
mass: 30000

techLevel: 1

transportSlotsNeeded:1
radius: 8
#displayRadius: 20
disableDeathOnZeroHp:true

[graphics]
showHealthBar:true
showEnergyBar:true
icon_zoomed_out_neverShow:true
