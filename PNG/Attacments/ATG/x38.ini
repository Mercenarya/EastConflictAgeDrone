
[core]
showInEditor: true
name: x38
#overrideAndReplace
displayText: X-38МЛ
displayDescription_ru: Многоцелевая ракета Х-38МЛ наводится по целеуказанию , способная лететь на 40 километров , хорошо подходит для точечных ударов. 
displayDescription:  The Kh-38ML multi-purpose missile is target-guided, capable of flying at 40 kilometres, and is well suited for pinpoint strikes. 


tags:rf,ATR,rocket
class: CustomUnitMetadata
price: 1
maxHp: 100
armour:100
armourMinDamageToKeep:0
mass: 30000

techLevel: 1

transportSlotsNeeded:1
radius: 8
#displayRadius: 20
disableDeathOnZeroHp:true

[graphics]
showHealthBar:true
showEnergyBar:true
icon_zoomed_out_neverShow:true
total_frames: 1


image:        ROOT:/PNG/null.png
image_wreak:  none
image_turret: none
teamColorsOnTurret: true
scaleImagesTo: 0.4

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 1
turretTurnSpeed: 10

maxAttackRange: 0
shootDelay: 0.1




[turret_MainGun]
x: 0
y: 0

projectile:1
shoot_sound:ROOT:/ogg/rf/Igla.ogg
shoot_sound_vol:0.5
resourceUsage:ammo=1
limitingAngle:20


canOnlyAttackUnitsWithTags:radar,armor,noarmor
invisible:true

[effect_projectileTrail]
priority:critical

stripIndex: effects
frameIndex: 0


life: 500
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime:1.5
scaleFrom: 0.4
scaleTo: 0.4
alpha: 1
drawUnderUnits:false

atmospheric:true


shadow:true
yOffsetRelative: -30
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2



[projectile_1]
#X25
#heat
directDamage: 2000
armourIgnoreAmount:500
areaDamage: 800
shieldDamageMultiplier:3
areaRadius: 23
largeHitEffect: true
life: 420
speed:7.1

image:ROOT:/PNG/Projectiles/kh38ml.png
drawSize:0.5


explodeEffect:CUSTOM:pyro, CUSTOM:projectileSound, CUSTOM:projectileGroundSmoke*4, CUSTOM:projectileGroundSplash*3, CUSTOM:projectileWaterSmoke*2, CUSTOM:projectileWaterSplash*3, CUSTOM:projectileFlash,CUSTOM:projectileCrater
trailEffect: projectileTrail
trailEffectRate: 0.5
tags:x25,AntiRadar,AGM

turnSpeed:0.9
explodeOnEndOfLife:true
friendlyFire:true
initialUnguidedSpeedHeight: 1.2
gravity:0.18




[arm_1]
x:0
y:0
hidden:if self.ammo(lessThan=1)
image_end:ROOT:/PNG/Projectiles/kh38ml.png
lockMovement:true






[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false



[hiddenAction_ammoReload1]
autoTrigger: if self.ammo(lessThan=1) and self.queueSize(lessThan=1) and self.numberOfUnitsInTeam(withTag='zapravka',greaterThan=0,withinRange=100)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 35s
addResources:ammo=1

[action_notFire]

setUnitStats: maxAttackRange=1

text:Not Fire
text_ru: Запретить огонь
isVisible: if not self.hasFlag(id=1)
addResources: setFlag=1
buildSpeed: 0s

[action_Fire]

setUnitStats: maxAttackRange=1800

text:Fire
text_ru: Разрешить огонь
isVisible: if self.hasFlag(id=1)
addResources: unsetFlag=1
buildSpeed: 0s

