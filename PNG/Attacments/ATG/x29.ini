
[core]
showInEditor: false
name: x29
#overrideAndReplace
displayText: X-29Т
displayDescription_ru:     Высокоточная ракета класса воздух-поверхность. Использует телевизионную ГСН. Реализует принцип "выстрелил-забыл", сразу после пуска самолёт может покинуть зону стрельбы. Масса ВВ 116кг.
displayDescription:     High-precision air-to-surface missile. It utilizes a television-tracking system. Realizes the principle of "shot-forget", immediately after launch the aircraft can leave the firing zone. The mass of explosives is 116 kg.

