
[core]
showInEditor: true
name: x38polet
#overrideAndReplace
displayText: X-38МЛ
displayDescription_ru: Многоцелевая ракета Х-38МЛ наводится по целеуказанию , способная лететь на 40 километров , хорошо подходит для точечных ударов. 
displayDescription:  The Kh-38ML multi-purpose missile is target-guided, capable of flying at 40 kilometres, and is well suited for pinpoint strikes. 

tags:kh38ml
class: CustomUnitMetadata
price: 1
maxHp: 100
armour:100
armourMinDamageToKeep:0
mass: 30000

techLevel: 1

transportSlotsNeeded:1
radius: 8
#displayRadius: 20

energyMax:200
energyRegen:-0.5
energyNeedsToRechargeToFull:true
dieOnZeroEnergy:true

canOnlyBeAttackedByUnitsWithTags:xoxlipidorizzzzzzzzzzzzzzzzzzzovvvvvvvvvvvzovov


effectOnDeath:CUSTOM:pyro, CUSTOM:projectileSound, CUSTOM:projectileGroundSmoke*4, CUSTOM:projectileGroundSplash*3, CUSTOM:projectileWaterSmoke*2, CUSTOM:projectileWaterSplash*3, CUSTOM:projectileFlash,CUSTOM:projectileCrater

[graphics]

icon_zoomed_out_neverShow:true
total_frames: 1


image:ROOT:/PNG/Projectiles/kh38ml.png
image_wreak:  none
image_turret: none
teamColorsOnTurret: true
imageScale: 0.2

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

showEnergyBar:false
showHealthBar:false
showQueueBar:false


movementEffect: CUSTOM:projectileTrail
movementEffectRate: 0.5


[effect_projectileTrail]
priority:critical

stripIndex: effects
frameIndex: 0


life: 500
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime:1.5
scaleFrom: 0.4
scaleTo: 0.4
alpha: 1
drawUnderUnits:false

atmospheric:true


shadow:true
yOffsetRelative: -30
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2



[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
dieOnAttack: true

attackMovement:Suicide
turretSize: 20
turretTurnSpeed: 40

aimOffsetSpread:0
maxAttackRange: 50
shootDelay: 0.15s



[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canOnlyAttackUnitsWithTags:kh38podsvetka
projectile: 1
size: 1.1
turnSpeed: 20

[projectile_1]
#cannot use directDamage with targetGround
areaDamage: 4300
areaRadius: 110
shieldDamageMultiplier:3
largeHitEffect: true
life: 1500
tags: HEAT
targetGroundSpread: 5
targetGround: true
speed: 3000
drawSize: 0
image: ROOT:/png/null.png
explodeEffect:none
spawnProjectilesOnExplode:HEAT_Component*25

[projectile_HEAT_Component]
tags: HEAT
directDamage: 20
life: 500
speed: 15
areaDamage:10
areaRadius: 10
armourIgnoreAmount:5
areaExpandTime: 0
friendlyFire: true
targetGround: true
targetGroundSpread:255
explodeOnEndOfLife:true
image:ROOT:/png/null.png
explodeEffect:none


[movement]
movementType: AIR
moveSpeed: 7.1
moveAccelerationSpeed: 1
moveDecelerationSpeed: 0

maxTurnSpeed: 0.9
turnAcceleration: 0.04
targetHeight:20

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25

reverseSpeedPercentage:0

slowDeathFall:false


[hiddenAction_x38_start]
autoTriggerOnEvent:created
addWaypoint_type:move
addWaypoint_prepend:true
addWaypoint_position_relativeOffsetFromSelf:0, 500
addResources:setFlag=1
alsoQueueAction:х38_polet_1


[hiddenAction_х38_polet_1]
addWaypoint_prepend:true
addWaypoint_type: attackMove
addWaypoint_target_nearestUnit_tagged:kh38podsvetka
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:2000
buildSpeed:0.1s
#showMessageToPlayer:Ракета вышла на курс епта
alsoQueueAction:х38_polet_2

[hiddenAction_х38_polet_2]
clearActiveWaypoint:true
addWaypoint_prepend:true
addWaypoint_type: attackMove
addWaypoint_target_nearestUnit_tagged:kh38podsvetka
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_maxRange:1800
buildSpeed:0.1s
#showMessageToPlayer:Ракета вышла на 2 курс епта
alsoQueueAction:х38_polet_2





