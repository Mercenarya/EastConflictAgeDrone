
[core]
showInEditor: false
name: x31
#overrideAndReplace
displayText: X-31П
displayDescription_ru:     Противорадиолокационная ракета, предназначенная для уничтожения радаров противника. Увеличена дальность пуска, по сравнению с Х-25МПУ.
displayDescription:     An anti-radar missile designed to destroy enemy radars. Increased launch range compared to the X-25MPU.

tags:rf,ATR,rocket
class: CustomUnitMetadata
price: 1
maxHp: 100
armour:100
armourMinDamageToKeep:0
mass: 30000

techLevel: 1

transportSlotsNeeded:1
radius: 8
#displayRadius: 20
disableDeathOnZeroHp:true

[graphics]
showHealthBar:true
showEnergyBar:true
icon_zoomed_out_neverShow:true
total_frames: 1


image:        ROOT:/PNG/null.png
image_wreak:  none
image_turret: none
teamColorsOnTurret: true
scaleImagesTo: 0.7

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 1
turretTurnSpeed: 10

maxAttackRange: 3000
shootDelay: 0.7




[turret_MainGun]
x: 0
y: 0

projectile:1
shoot_sound:ROOT:/ogg/rf/Igla.ogg
shoot_sound_vol:0.5
resourceUsage:ammo=1
limitingAngle:20
delay:0

canOnlyAttackUnitsWithTags:radar
invisible:true



[projectile_1]
#X25
#heat
directDamage: 2000
armourIgnoreAmount:500
areaDamage: 1000
shieldDamageMultiplier:3
areaRadius: 30
largeHitEffect: true
life: 500
speed:7.1


image:ROOT:/PNG/Projectiles/X31P_polet.png
drawSize:0.55


explodeEffect:CUSTOM:pyro,shockwave,smallExplosion
#trailEffect: true
trailEffect: CUSTOM:projectileTrail
trailEffectRate:0.5
tags:x25,AntiRadar,AGM

turnSpeed:0.9
explodeOnEndOfLife:true
friendlyFire:true
initialUnguidedSpeedHeight: 1.2
gravity:0.18


[effect_projectileTrail]
priority:critical

stripIndex: effects
frameIndex: 0


life: 500
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime:1.5
scaleFrom: 0.5
scaleTo: 0.5
alpha: 1
drawUnderUnits:true

atmospheric:false



shadow:false
yOffsetRelative: -30
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2




[effect_pyro]
spawnChance:1
life:60
alpha:0
alsoEmitEffects:CUSTOM:sparks*6,CUSTOM:sparks2*4, smoke

[effect_sparks]
attachedToUnit: false
life: 150
scaleFrom:1
scaleTo: 0.4
physics: true
xSpeedRelativeRandom: 1
ySpeedRelativeRandom: 1
hSpeed: 1
priority: low

[effect_sparks2]
attachedToUnit: false
life: 150
scaleFrom:1.6
scaleTo: 0.3
physics: true
xSpeedRelativeRandom: 2
ySpeedRelativeRandom: 2
hSpeed: 1
priority: low



[arm_1]
x:0
y:0
hidden:if self.ammo(lessThan=1)
image_end:ROOT:/PNG/Projectiles/X31P.png
lockMovement:true






[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false



[hiddenAction_ammoReload1]
autoTrigger: if self.ammo(lessThan=1) and self.queueSize(lessThan=1) and self.numberOfUnitsInTeam(withTag='zapravka',greaterThan=0,withinRange=100)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 35s
addResources:ammo=1

[action_notFire]

setUnitStats: maxAttackRange=1

text:Not Fire
text_ru: Запретить огонь
isVisible: if not self.hasFlag(id=1)
addResources: setFlag=1
buildSpeed: 0s

[action_Fire]

setUnitStats: maxAttackRange=3000

text:Fire
text_ru: Разрешить огонь
isVisible: if self.hasFlag(id=1)
addResources: unsetFlag=1
buildSpeed: 0s












































