
[core]
showInEditor: false
name: igla
#overrideAndReplace
displayText: УРВВ Игла
displayDescription: Управляемая Ракета Воздух-Воздух \n Уничтожает воздушные цели

tags:rf,AA,rocket,LandAirRocket
class: CustomUnitMetadata
price: 1
maxHp: 100
armour:100
armourMinDamageToKeep:0
mass: 30000

techLevel: 1

transportSlotsNeeded:1
radius: 8
#displayRadius: 20
disableDeathOnZeroHp:true

[graphics]
showHealthBar:true
showEnergyBar:true
icon_zoomed_out_neverShow:true
total_frames: 1


image:        ROOT:/PNG/null.png
image_wreak:  none
image_turret: none
teamColorsOnTurret: true
scaleImagesTo: 1.2

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 1
turretTurnSpeed: 10

maxAttackRange: 660
shootDelay: 1



[turret_mainGunAir1]
x: 0
y: 0

projectile:1
shoot_sound:ROOT:/ogg/rf/Strela.ogg
shoot_sound_vol:0.35
resourceUsage:ammo=1
limitingAngle:15
delay:8s

[projectile_1]
#Aim9
areaDamage: 2800
shieldDamageMultiplier:3
areaRadius: 20
largeHitEffect: true
life: 150
speed:9.7

lightColor:#d2ff00
lightSize:0.8

image:ROOT:/PNG/Projectiles/igla.png
drawSize:0.8


explodeEffect:CUSTOM:pyro
trailEffect:true
tags:missile,igla
armourIgnoreAmount:100
turnSpeed:1.43
explodeOnEndOfLife:true
friendlyFire:true
retargetingInFlight:true
retargetingInFlightSearchDelay:0.47
retargetingInFlightSearchRange:40
retargetingInFlightSearchOnlyTags:FalseTargetAir 


[effect_pyro]
spawnChance:1
life:60
alpha:0
alsoEmitEffects:CUSTOM:sparks*6,CUSTOM:sparks2*4, smoke

[effect_sparks]
attachedToUnit: false
life: 150
scaleFrom:1
scaleTo: 0.4
physics: true
xSpeedRelativeRandom: 1
ySpeedRelativeRandom: 1
hSpeed: 1
priority: low

[effect_sparks2]
attachedToUnit: false
life: 150
scaleFrom:1.6
scaleTo: 0.3
physics: true
xSpeedRelativeRandom: 2
ySpeedRelativeRandom: 2
hSpeed: 1
priority: low



[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false


[arm_1]
x:0
y:0

image_end:ROOT:/PNG/Attacments/igla_pu.png
lockMovement:true


[hiddenAction_ammoReload1]
autoTrigger: if self.ammo(lessThan=1) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 25s
addResources:ammo=2


[action_notFire]

setUnitStats: maxAttackRange=1
text:Not Fire
text_ru: Запретить огонь
isVisible: if not self.hasFlag(id=1)
addResources: setFlag=1
buildSpeed: 0s

[action_Fire]
setUnitStats: maxAttackRange=660

text:Fire
text_ru: Разрешить огонь
isVisible: if self.hasFlag(id=1)
addResources: unsetFlag=1
buildSpeed: 0s
































