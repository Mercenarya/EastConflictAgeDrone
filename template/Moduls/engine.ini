
[core]
showInEditor: false
name: tankEngine
#overrideAndReplace
displayText: -
displayDescription: -

tags:engine,armor
class: CustomUnitMetadata
price: 1
maxHp: 320
armour:100
armourMinDamageToKeep:0
mass: 30000
#canNotBeDirectlyAttacked:true
techLevel: 1

transportSlotsNeeded:1
radius: 8
#displayRadius: 20
disableDeathOnZeroHp:true
autoTriggerCooldownTime:0.2s

[graphics]
showHealthBar:true
showEnergyBar:true
icon_zoomed_out_neverShow:true
total_frames: 1
scaleImagesTo: 25

image:        null.png
image_wreak:  null.png
image_turret: none
teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 1
turretTurnSpeed: 1

maxAttackRange: 1
shootDelay: 1

[turret_1]
#"barrel"
x:0
y:0
canShoot:false


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false



[action_NotMove]
autoTrigger: if self.hp(lessThan=1)
temporarilyRemoveTags:engine
isVisible:false


[action_Move]
autoTrigger: if self.hp(greaterThan=30)
resetToDefaultTags:true
isVisible:false


[effect_dimok]
image:ROOT:/PNG/dimok.png
priority:high
life:200
xOffsetRelative:-5
yOffsetRelative:-5
ySpeedRelative:0.15
xSpeedRelative:0.2
ySpeedRelativeRandom:0.07
xSpeedRelativeRandom:0.04
scaleTo:2.8
scaleFrom:0.5
dirOffsetRandom:360



[action_dead]
autoTrigger: if self.hp(lessThan=1)

isVisible:false


spawnEffects:CUSTOM:dimok
addResources:hp=10



[action_Repair]
autoTrigger: if self.numberOfUnitsInNeutralTeam(withTag='engineer',greaterThan=0,withinRange=100) or self.numberOfUnitsInTeam(withTag='engineer',greaterThan=0,withinRange=80)
isVisible:false
addResources:hp=10





[hiddenAction_da]
autoTrigger:true
switchToTeam:customTarget1.teamId


















