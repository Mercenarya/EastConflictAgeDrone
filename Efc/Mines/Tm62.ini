effectOnDeath:CUSTOM:pyro*10, CUSTOM:projectileSound, CUSTOM:projectileGroundSmoke*4, CUSTOM:projectileGroundSplash*3, CUSTOM:projectileWaterSmoke*2, CUSTOM:projectileWaterSplash*3, CUSTOM:projectileFlash,CUSTOM:projectileCrater

[hiddenAction_mina]
autoTrigger: if numberOfUnitsInEnemyTeam(withTag='kmt7',withinRange=40,greaterThan=0)
setUnitStats: hp=-100


[graphics]
