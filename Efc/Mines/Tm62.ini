[core]
name: Tm62
class: CustomUnitMetadata
price: 800
maxHp: 100
mass: 3000
displayText: ТМ-62
displayDescription: Советская противотанковая Мина \n срабатывает при наезжании проекции танка на мину. \n Уничтожает все)
