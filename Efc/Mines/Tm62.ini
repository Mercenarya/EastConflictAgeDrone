imageScale:0.15
image:        null.png
image_wreak:  NONE
image_turret: NONE

image_shadow: none
shadowOffsetX:1
shadowOffsetY:1

animation_idle_start:0
animation_idle_end: 0

showEnergyBar:false
[attack]
dieOnAttack: true
isMelee: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false
canAttackNotTouchingWaterUnits: true

maxAttackRange: 5


[turret_1]
invisible: true
x: 0
y: 0
idleDir:0
delay: 1
projectile: 1
size: 1
canOnlyAttackUnitsWithTags:armor,noarmor

[projectile_1]
armourIgnoreAmount:600
directDamage: 500
life: 0
instant: true
frame: 15
areaRadius: 20
areaDamage: 1600





[movement]
