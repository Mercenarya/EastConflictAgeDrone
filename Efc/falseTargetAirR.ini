
[core]
tags:FalseTargetAir
name: falseTargetAirR
showInEditor:false
class: CustomUnitMetadata
price: 0
maxHp: 1
armour: 10000
armourMinDamageToKeep: 0
mass: 6
transportSlotsNeeded: 10 
techLevel: 1
explodeOnDeath: false
radius: 1
#displayRadius: 10
isBio: false
softCollisionOnAll: 1
fogOfWarSightRange: 1
energyMax: 500
energyRegen: -0.1
dieOnZeroEnergy: true
canOnlyBeAttackedByUnitsWithTags:LandAirRocket
isUnselectable:true
showOnMinimap:false

[graphics]
total_frames: 1
showEnergyBar:false
image:        null.png
image_wreak:  NONE
image_turret: NONE

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

image_shadow: NONE

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 2
turretTurnSpeed: 0.5

aimOffsetSpread: 0
maxAttackRange: 2
shootDelay: 0


[action_trigger_delete]
autoTrigger:if numberOfUnitsInTeam(withTag='AirFHT',withinRange=200, lessThan=1)
isVisible:false
deleteSelf:true

[action_trigger_work]
autoTrigger:if numberOfUnitsInTeam(withTag='AirFHT',withinRange=100, greaterThan=0) and self.customTimer(laterThanSeconds=1)
isVisible:false

addWaypoint_prepend:true
addWaypoint_type:move
addWaypoint_position_relativeOffsetFromSelf:-190,-280
#addWaypoint_position_randomOffsetFromSelf:70,70
addWaypoint_maxTime: 15s
resetCustomTimer:true

[movement]
movementType: AIR
moveSpeed: 1.8
moveAccelerationSpeed: 1
moveDecelerationSpeed: 1

maxTurnSpeed: 10
turnAcceleration: 1

moveSlidingMode :false
moveIgnoringBody:false
