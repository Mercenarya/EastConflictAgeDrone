[core]
name: Supplies
displayText: Ammo Crate
displayText_ru: Ящик с боеприпасами
displayDescription: Field ammunition crate. Automatically resupplies nearby infantry and combat units.
displayDescription_ru: Полевой ящик с боеприпасами. Автоматически пополняет боезапас ближайшей пехоте và технике.

tags: ammo, transporting
class: CustomUnitMetadata
price: 150
maxHp: 150
armour: 3
armourMinDamageToKeep: 0
mass: 500
techLevel: 1
buildSpeed: 6s

energyMax: 100
energyRegen: 0

transportSlotsNeeded: 1
radius: 10
displayRadius: 10
isBio: false
isBuilding: false
stayNeutral: false

fogOfWarSightRange: 4

[graphics]
showHealthBar: true
showEnergyBar: true
icon_zoomed_out_neverShow: true
total_frames: 1

image: images/Supplies.png
image_wreak: none
image_turret: none
teamColorsOnTurret: true
scaleImagesTo: 14

image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: LAND
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
maxTurnSpeed: 0
turnAcceleration: 0
moveSlidingMode: false
moveIgnoringBody: false

# Status badge
[action_ammoDisplay]
isLocked: true
isVisible: if self.energy(greaterThan=0)
text: Ammo
text_ru: Боезапас
description: Supplies remaining in crate
description_ru: Запас патронов в ящике
buildSpeed: 0s
pos: 1

# Optional discard when empty
[action_deleteEmpty]
isVisible: if self.isEnergyEmpty()
text: Discard empty crate
text_ru: Утилизировать пустой ящик
description: Remove depleted supply crate
description_ru: Убрать пустой ящик
buildSpeed: 1s
addResources: hp=-1000
pos: 2

# Resupply nearby friendly units (drains 2 supplies every 5s while units are nearby)
[hiddenAction_ammoReload]
autoTrigger: if numberOfUnitsInTeam(withinRange=100, greaterThan=1) and self.queueSize(lessThan=1) and self.energy(greaterThan=0)
alsoQueueAction: LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources: energy=-2

# Initialize energy to 100 on created
[hiddenAction_start]
autoTriggerOnEvent: created
addResources: energy=100

# Remove ammo tag when empty so units don't pull from an empty crate
[hiddenAction_emptyAmmo1]
autoTrigger: if self.isEnergyEmpty() and self.tags(includes='ammo')
temporarilyRemoveTags: ammo

# Restore ammo tag when crate has supplies
[hiddenAction_emptyAmmo12]
autoTrigger: if self.energy(greaterThan=0) and not self.tags(includes='ammo')
temporarilyAddTags: ammo

# Resupply from Ammo Truck (Ural / ammoyral)
[hiddenAction_ammoReloadFromTruck]
autoTrigger: if numberOfUnitsInTeam(withTag="ammoyral", withinRange=100, greaterThan=0) and self.energy(lessThan=100) and self.queueSize(lessThan=1)
alsoQueueAction: LoadBKFromTruck

[hiddenAction_LoadBKFromTruck]
buildSpeed: 5s
addResources: energy=5
