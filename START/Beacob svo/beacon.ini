
[core]
overrideAndReplace: commandCenter
tags: svo,chose1
name: Beaconsvo
displayText: Центр
displayDescription: - Готов возглавить Одну Из Сторон? И стать Настоящим Стратегом?

class: CustomUnitMetadata
price: 0
maxHp: 10000
mass: 80000

techLevel: 1
buildSpeed: 0.001
#availableInDemo: true
transportSlotsNeeded: 0

radius: 42
displayRadius: 42

isBio: false
softCollisionOnAll: 0

isBuilding: true

footprint: -4,-4,4,4
constructionFootprint: -4,-4,4,4
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10



[action_machines]
temporarilyAddTags:mode_vanila,fight
convertTo: BEACON_Rf
#spawnUnits:INGR
isLocked:if numberOfUnitsInEnemyTeam(withTag="RF1_beacon", greaterThan=0) or not numberOfUnitsInEnemyTeam(withTag="chose2", greaterThan=0) and self.isControlledByAI()
text: RF 
buildSpeed: 1
pos: 0.1
ai_considerSameAsBuilding:BEACON_Rf
ai_isHighPriority:true
spawnUnits:INGRZ

[action_bugs]
temporarilyAddTags:mode_vanila, fight
convertTo: BEACON_UKR
isLocked:if numberOfUnitsInEnemyTeam(withTag="UKR_beacon", greaterThan=0) or not numberOfUnitsInEnemyTeam(withTag="chose2", greaterThan=0) and self.isControlledByAI()
text: UKR
displayType: upgrade
buildSpeed: 1
pos: 0.2
ai_considerSameAsBuilding:BEACON_UKR
ai_isHighPriority:true
spawnUnits:INGRUKR


[graphics]
total_frames: 1
imageScale: 0.45
image:        beacon.png
image_wreak:  NONE
image_turret: NONE

image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1
animation_idle_start: 0
animation_idle_end: 0
animation_idle_speed: 9

dustEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 14
turretTurnSpeed: 4


maxAttackRange: 0
shootDelay: 90


[movement]
movementType: LAND
moveSpeed: 0
moveAccelerationSpeed: 0.0
moveDecelerationSpeed: 0.0

reverseSpeedPercentage:0.8

maxTurnSpeed: 0.0
turnAcceleration: 0.25

moveSlidingMode :false
moveIgnoringBody:false

[ai]
buildPriority: 0.2
noneInBaseExtraPriority: 0.5
useAsBuilder: true
maxEachBase: 2



#[hiddenAction_kill]
#	autoTriggerOnEvent:created
#	fireTurretXAtGround:splash
#fireTurretXAtGround_withOffset: 0,0



[action_trigger_start]
autoTriggerOnEvent: created
isVisible:false
showMessageToPlayer:Attention!  For a comfortable game, you need to have basic knowledge in military subjects.
showMessageToPlayer_ru:Внимание! Для комфортной игры вам необходимо обладать базовыми знаниями в военной тематике
fireTurretXAtGround: spawner
fireTurretXAtGround_withOffset: 0,10
fireTurretXAtGround_count:1

[turret_spawner]
x: 0
y: 0
canShoot: false
invisible: true
size:0
projectile:spawner

[projectile_spawner]
directDamage:0
life: 150
speed: 99
drawType: 2
frame: 1
drawSize: 0
hitSound: false
targetGround:true
largeHitEffect: false
spawnUnit: TimeZ(gridAlign=true, skipIfOverlapping=true,spawnChance=1,maxSpawnLimit=1)

targetGroundSpread: 400
explodeEffect: NONE


























[hiddenAction_start]
autoTriggerOnEvent: created
addResources:setFlag=10

[hiddenAction_infantry]
autoTriggerOnEvent: created
addResources:Manpower=25,lendliz=1

[hiddenAction_bot]
autoTrigger: if self.isControlledByAI()
addResources:Manpower=40000,Oil=40000,Ammo=40000
temporarilyAddTags:ai














