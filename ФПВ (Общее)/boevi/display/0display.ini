[hiddenAction_BataHui]
autoTrigger:if self.hasFlag(id=5) and not self.hasFlag(id=7)
buildSpeed:2s
addResources:unsetFlag=5,7.62LPS=-1
alsoQueueAction:BataPizda
#wMessageToPlayer:Minus tag


[hiddenAction_BataPizda]
addResources:setFlag=5,7.62LPS=1
#showMessageToPlayer: plys tag
buildSpeed:0.25s

[hiddenAction_poka]
autoTrigger: if  numberOfUnitsInTeam(withTag='noDisplay',withinRange=10,greaterThan=0) 
deleteSelf:true

[hiddenAction_pokaa]
autoTrigger: if  numberOfUnitsInTeam(withTag='Move',withinRange=10,greaterThan=0) 
