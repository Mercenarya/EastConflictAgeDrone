
[core]
showInEditor: false
name: displayFpv
#overrideAndReplace
displayText: -
displayDescription: -

tags:rf,display,firstM,00m
class: CustomUnitMetadata
price: 1
maxHp: 100
armour:100
armourMinDamageToKeep:0
mass: 30000
energyMax:75
energyRegen:1
energyNeedsToRechargeToFull:true
dieOnZeroEnergy:true
techLevel: 1
explodeOnDeath:false
canOnlyBeAttackedByUnitsWithTags:fpv,FPV,drons
transportSlotsNeeded:1
radius: 8
#displayRadius: 20
disableDeathOnZeroHp:true

isUnselectable:true

[graphics]
showHealthBar:true
showEnergyBar:false
icon_zoomed_out_neverShow:true
total_frames: 1


image:        null.png
image_wreak:  none
image_turret: none
teamColorsOnTurret: true
scaleImagesTo: 5

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
showQueueBar:false

[attack]
canAttack: false
canAttackFlyingUnits:     false
canAttackLandUnits:       false
canAttackUnderwaterUnits: false

turretSize: 1
turretTurnSpeed: 100

maxAttackRange: 0
shootDelay: 0



[turret_mainGunAir1]
canShoot: false
x: 0
y: 0


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0


maxTurnSpeed: 0
turnAcceleration: 0

moveSlidingMode :false
moveIgnoringBody:false

[hiddenAction_start]
autoTriggerOnEvent: created
addResources:fuel=3,7.62LPS=1,setFlag=10,25APDS=3,25HEI=1,30APDS=3,5.56NATO=1
#lsoQueueAction:startTime

[attachment_maksik]
x: 0
y: 0
onCreateSpawnUnitOf: timerFpv
canBeAttackedAndDamaged: true
isUnselectable: false
setDrawLayerOnBottom:true
rotateWithParent:false
lockRotation:true

