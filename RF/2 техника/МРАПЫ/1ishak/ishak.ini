[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withinRange=100,greaterThan=1) and self.queueSize(lessThan=1) and self.resource(type='ammo',greaterThan=0)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:ammo=-2


[hiddenAction_start]
autoTriggerOnEvent: created
addResources:ammo=100

[hiddenAction_emptyAmmo1]
autoTrigger:if self.resource(type='ammo',lessThan=1)
temporarilyRemoveTags:ammo

[hiddenAction_emptyAmmo12]
autoTrigger:if self.resource(type='ammo',greaterThan=1)
temporarilyAddTags:ammo

[hiddenAction_ammoReload123123]
autoTrigger: if  numberOfUnitsInTeam(withTag="ammoyral",withinRange=100,greaterThan=0)
alsoQueueAction:LoadBK12313

[hiddenAction_LoadBK12313]
buildSpeed: 5s
addResources:ammo=2


