[core]
name: УАЗ-СГР
displayText: UAZ-SGR (Zala Z-16)
displayText_ru: УАЗ-СГР (Zala Z-16)
displayDescription: Zala Z-16 Recon Squadron \n Limit 3 units
displayDescription_ru:  Отряд развед бпла Zala Z-16 \n Лимит: 3 юнита


class: CustomUnitMetadata
price: 17000,Oil=100
maxHp: 350
mass: 3000
armour:12
maxTransportingUnits: 0
transportSlotsNeeded:20
techLevel: 1
buildSpeed: 45s
#availableInDemo: true
fogOfWarSightRange: 8
radius: 25
displayRadius: 30

isBio: false
softCollisionOnAll: 10
#soundOnMoveOrder:ROOT:/ogg/rf/gas.OGG 

tags:zalacato


[graphics]
total_frames: 1

image:        chle.png
image_wreak:  dead.png
image_turret: NONE


imageScale:0.65

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 0


dustEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false



[movement]
movementType: LAND
moveSpeed: 1.7
moveAccelerationSpeed: 0.09
moveDecelerationSpeed: 0.17

maxTurnSpeed: 1.3
turnAcceleration: 0.07

moveSlidingMode :false
moveIgnoringBody:false



[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=99,zala=4

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать водяру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=140) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=1






[action_Depun]
convertTo: zala_osnova
buildSpeed: 15s
pos: 0.1
text:Unfold 
text_ru: Развернуть


[attachment_gun]
x: 0
y: 0

isVisible:false
addTransportedUnits:true
canBeAttackedAndDamaged: false
isUnselectable: true
keepAliveWhenParentDies:false
rotateWithParent:false
resetRotationWhenNotAttacking:true




[action_trigger_delete] 
autoTrigger:if numberOfUnitsInTeam(withTag='zalacato', greaterThan=3) 
isVisible:false 
deleteSelf:true


















































































































































