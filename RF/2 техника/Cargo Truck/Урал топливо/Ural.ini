#(((REIHAN)))



[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=5000

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/FuelIncom.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelOut]
autoTrigger: if  numberOfUnitsInTeam(withinRange=100,greaterThan=1) and self.resource(type='fuel',greaterThan=70) and self.queueSize(lessThan=1)
alsoQueueAction:unLoadFuel

[hiddenAction_unLoadFuel]
buildSpeed: 1
addResources: fuel=-1

[hiddenAction_emptyFuel]
autoTrigger:if self.resource(type='fuel',lessThan=71)
temporarilyRemoveTags:Fuel























