
[core]
tags:engineer,noarmor
#overrideAndReplace: tank
name: УРАЛИ
class: CustomUnitMetadata
price: 3000,Oil=2000,Ammo=1000
maxHp: 100
mass: 3000
armour:12
armourMinDamageToKeep:0
displayText: Ural (Engineer)
displayText_ru: Урал (Инженерный)
displayDescription: Engineer vehicle. Repairs buildings and equipment
displayDescription_ru:  Инженерная машина. Служит для ремонта зданий и техники.
canRepairBuildings: true
canRepairUnits : true
canReclaimResources: true
autoRepair: true
nanoRangeForReclaim:20
nanoRangeForReclaimIsMelee:true
fogOfWarSightRange: 8
techLevel: 1
buildSpeed: 16s
#availableInDemo: true

radius: 30
displayRadius: 40
isBio: false
softCollisionOnAll: 3

energyMax: 50
energyRegen: 0.05
energyNeedsToRechargeToFull: true

transportSlotsNeeded: 25
maxTransportingUnits: 0

selfRegenRate:0.4
nanoRange: 100
nanoBuildSpeed: 5.0
#soundOnMoveOrder:ROOT:/ogg/rf/URAL.OGG


[graphics]
total_frames: 1

image:        UralEng.png
image_wreak:  Ural_dead.png
image_turret: none
scaleImagesTo:57

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true
imageScale: 0.5
repairEffectAtTarget:CUSTOM:repair, CUSTOM:Gaika, CUSTOM:smoke, CUSTOM:Bolt
repairEffectRate:50

[effect_repair]
	life:100
	image:ROOT:/PNG/Pochinka.png
	ySpeedRelative:0
	xSpeedRelative:0
	drawUnderUnits:false			
	hSpeed: 0.35
	scaleFrom:0.3
	scaleTo:0.4
 hOffset:10

[effect_Gaika]
	life:150
	image:ROOT:/PNG/Gaika.png
      physics:true
      alsoEmitEffects:CUSTOM:Gaika
  	ySpeedRelativeRandom:1.5
	xSpeedRelativeRandom:1.5
      hOffset: 7	
      hSpeed: 0.5
      dirOffsetRandom: 69
	scaleFrom:0.15
	scaleTo:0.15

[effect_smoke]
      life:100
      scaleFrom:1.5
      color:#808080
	scaleTo:1.5

[effect_Bolt]
	life:150
	image:ROOT:/PNG/Bolt.png
      physics:true
      alsoEmitEffects:CUSTOM:Bolt
  	ySpeedRelativeRandom:1.5
	xSpeedRelativeRandom:1.5
      hOffset: 7	
      hSpeed: 0.5
      dirOffsetRandom: 69
	scaleFrom:0.2
	scaleTo:0.2



[attack]

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false


turretSize: 20
turretTurnSpeed: 3

turretMultiTargeting: true
maxAttackRange: 120
shootDelay: 158


[turret_3]
#ACTIVE
x: 0
y: 0
image:null.png

[movement]
movementType: LAND
moveSpeed: 1.3
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.05

maxTurnSpeed: 1
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false

[ai]
useAsBuilder: true


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=70

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=70) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=1








































