displayDescription: Soviet SPAA\n Poor protection, only against small arms\n 4 23mm Amur cannons \n Extra weapons - none\n Speed 30-50 km/h \n Hull turning speed - Poor \n Ideal for defense against enemy transport helicopters, pretty good idea against combat helicopters, but not so good against aircraft. Also incredibly good against enemy infantry, 4 23mm cannons will turn the enemy squad into mincemeat \n has cool tracers)
displayDescription_ru: Советская зенитная самоходная установка\n Плохая Защищённость, только против стрелкового оружия\n 4 23мм пушки "Амур" \n Доп. Вооружение отсутствует \n Скорость 30-50 км/ч \n Скорость доворота корпуса - Плохая \n Идеал для обороны против транспортных вертолётов врага, довольно хорошая задумка против боевых вертолётов, а вот против самолётов не очень. Также невероятно хороша против пехоты врага, 4 23мм пушки превратят отряд врага в фарш \n имеет прикольные трассеры)
