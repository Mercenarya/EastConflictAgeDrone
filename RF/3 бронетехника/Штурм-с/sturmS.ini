ySpeedRelativeRandom: 2
hSpeed: 1
priority: low

[movement]
movementType: HOVER
moveSpeed: 0.8
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 1
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false


[arm_1]
x:0
y:-16.6
image_end:leg_sturmS.png
