
[core]
tags:s400
name: S400_roc
displayText: S-400 “Triumf”
displayText_ru: С-400 «Триумф» 
displayDescription: The Russian anti-aircraft missile system is a versatile, multi-purpose, long-range anti-aircraft missile system designed to destroy airplanes, reconnaissance aircraft, strategic and tactical aircraft, tactical ballistic missiles, medium-range ballistic missiles, cruise missiles, hypersonic targets \n and other modern and advanced airborne weapons of attack (AOA)
displayDescription_ru:  Российский зенитный ракетный комплекс (ЗРК) \n Универсальная, многоцелевая зенитная ракетная система большой дальности \n Предназначена для поражения самолётов, самолётов-разведчиков, самолётов стратегической и тактической авиации, тактических \n Оперативно-тактических баллистических ракет, баллистических ракет средней дальности, крылатых ракет, гиперзвуковых целей \n и других современных и перспективных средств воздушного нападения (СВН)
class: CustomUnitMetadata
price: 2
maxHp: 90
mass: 300000
armour:0
showInEditor: false

techLevel: 1
buildSpeed: 0.0012
#availableInDemo: true

radius: 25
