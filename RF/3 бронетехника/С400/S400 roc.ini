isVisible:false

[action_notTurn]
autoTrigger: if self.hasParent(withTag="move" )
setUnitStats: maxTurnSpeed=${movement.maxTurnSpeed}
isVisible:false

[action_set]
convertTo:S400_roc_fire

text:Decomposition of the missile launcher
text_ru: Разложение ракетной установки
disconnectFromParent:true


