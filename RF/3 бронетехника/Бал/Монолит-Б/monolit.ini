
[core]

name: monolit

tags:armor,noarmor,rf,AntiShip,rocket,radar

#overrideAndReplace: heavyTank

class: CustomUnitMetadata
price: 15000,Oil=7000
maxHp: 300
mass: 3000
armour:40
armourMinDamageToKeep:0
displayText: Monolit-B
displayText_ru: Монолит-Б
displayDescription:The Monolith-B over-the-horizon radar provides detection and target designation for Bastion and Bal coastal missile systems. \n Its detection range exceeds 700 kilometers. \n It has active and passive search capabilities. 
displayDescription_ru: Загоризонтая РЛС Монолит-Б обеспечивает обнаружение и выдачу целеуказания береговым ракетным комплексам типа Бастион и Бал. \n Дальность обнаружения составляет свыше 700 километров. \n Имеет возможность активного и пассивного поиска. 
fogOfWarSightRange: 8
techLevel: 1
buildSpeed: 30s
#availableInDemo: true
transportSlotsNeeded: 70
maxTransportingUnits: 0
showInEditor:false
radius: 35
displayRadius: 50

isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:/ogg/rf/engine_shilka.OGG

energyMax: 500
energyRegen: 0.6
energyNeedsToRechargeToFull: true

[action_xyi]
text_ru:Разложить радар
text:unfold
convertTo:monolit_un


[graphics]
total_frames: 1

image:        monolit-b.png
image_wreak:  none
image_turret: null.png

imageScale:0.57
scaleTurretImagesTo: 30


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 1

maxAttackRange: 2900
shootDelay: 1s



[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 0.6
turnAcceleration: 0.50

moveSlidingMode :false
moveIgnoringBody:false

[hiddenAction_start]
autoTriggerOnEvent: created
addResources:fuel=200



[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true


[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.3

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=130) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=2


































































































