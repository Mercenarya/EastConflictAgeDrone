
[core]
copyFrom: ROOT:template\EasyRadar\copyFrom\radar.copyFrom

@global EZRD_timeBetween: 0.1

@global EZRD_revealerUnit: RadarBlip

@global EZRD_Range: 4000

@global EZRD_Tag: zasvetArta

name: zoopark
tags: armor,noarmor,mtlb

#overrideAndReplace: tank

class: CustomUnitMetadata
price: 32000,Oil=3000,Ammo=4000
maxHp: 180
mass: 3000
armour:38
armourMinDamageToKeep:0
displayText: Zoopark-1
displayText_ru: Зоопарк-1
displayDescription: The 1L219M counter-battery radar has a high mobility, allowing to quickly enter positions and detect enemy firepower and also quickly leave the danger zone
displayDescription_ru: РЛС контрбатарейной борьбы 1Л219М имеет высокую мобильность , позволяющую быстро выйти на позиций и обнаружить огневые средства противника и также быстро уйти из опасной зоны
fogOfWarSightRange: 10
techLevel: 1
buildSpeed: 10s
#availableInDemo: true
transportSlotsNeeded: 31
maxTransportingUnits: 0

radius: 20
displayRadius: 35



isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:/ogg/rf/btr80.OGG

energyMax: 50
energyRegen: 1
energyNeedsToRechargeToFull: true


unitsSpawnedOnDeath:zoopark_dead*1


[graphics]
total_frames: 1

image:        zoopark1.png
image_wreak:  none
image_turret: zoopark2.png
scaleImagesTo: 30
scaleTurretImagesTo: 28

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[decal_sweepLine]
@define SweepTimeMultiplier: 72
onlyWhenSelectedByOwnPlayer: true
drawLineTo: self.getOffsetRelative(y=${EZRD_Range}, dirOffset=self.timeAlive*${SweepTimeMultiplier})
color: #00FF00
#This one is purely decorative

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false



turretSize: 20
turretTurnSpeed: 2.5

maxAttackRange: ${EZRD_Range}
#${EZRD_Range}
showRangeUIGuide: true
shootDelay: 7


turretMultiTargeting: true

[turret_2]
x:0
y:-4.5
canShoot:false
idleSweepAngle:80
idleSweepDelay:210
idleSweepSpeed:0.2

[action_shellsNUM]
isVisible: if self.hasFlag(id=4)
text: Machinegun ammo 7.62
text_ru: Пулеметные патроны 7.62(ЛПС)
description: -
description_ru: -
price: 7.62LPS=1

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: 7.62LPS=1200,100rapiraAPFSDS=22,100rapiraHE=7,100rapiraHEAT=9,setFlag=1,s5=40,fuel=140


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:7.62LPS=100


[movement]
movementType: HOVER
moveSpeed: 0.8
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 1
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false


[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=160) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=2

[action_trigger_delete] 
autoTrigger:if numberOfUnitsInTeam(withTag='mtlb', greaterThan=10) 
isVisible:false 
deleteSelf:true
showMessageToPlayer: нахуй спамишь далбаеб. Наебни говнища

[ai]
useAsTransport:true
maxGlobal:5



