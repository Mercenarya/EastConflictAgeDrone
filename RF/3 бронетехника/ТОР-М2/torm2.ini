
[core]
name: Torm2

tags:armor,noarmor,radar,LandAirRocket,AA_gun,torm2razh,pd11,sharkbpla,fp5_attack

#overrideAndReplace: heavyTank

class: CustomUnitMetadata
price: 18000
maxHp: 400
mass: 3000
armour:56
armourMinDamageToKeep:0
displayText: TOR-M2
displayText_ru: ЗРК ТОР-М2
displayDescription: TOR-M2 \n Soviet-Russian short-range anti-aircraft missile system (SAM) that is good at shooting down both missiles and aircraft \n Don't forget to replenish it and it will keep you happy n As cool as our Alemzhou 
displayDescription_ru: ТОР-М2  \n Советско-российский зенитный ракетный комплекс (ЗРК) малой дальности, что хорошо сбивает как ракеты, так и авиацию \n Не забывайте пополнять его и он будет радовать вас \n Так же крут, как наш Алемжоу 
fogOfWarSightRange: 8
techLevel: 1
buildSpeed: 30s
#availableInDemo: true
transportSlotsNeeded: 70
maxTransportingUnits: 0

radius: 35
displayRadius: 50

isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:/ogg/rf/engine_shilka.OGG

energyMax: 1500
energyRegen: 0.6
energyNeedsToRechargeToFull: true


[graphics]
total_frames: 1

image:        TorM2.png
image_wreak:  dead.png
image_turret: TorM2_T2.png

scaleImagesTo: 37
scaleTurretImagesTo: 37


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 1.5

maxAttackRange: 1500
shootDelay: 300


[turret_2]
#pac3
x: 0
y: -2
canShoot:false
warmup:0.1s
delay:5s


resourceUsage: ammo=1


[turret_1]
#pac3
x: 0
y: 0
attachedTo:2
slave:true


invisible:true
projectile: 1
warmup:0.1s
delay:5s

shoot_sound:ROOT:/ogg/rf/missile.ogg
shoot_sound_vol:0.5
#limitingRange: 120

energyUsage:200
resourceUsage: ammo=1

interceptProjectiles_withTags: ICBM
interceptProjectiles_andTargetingGroundUnderDistance: 1500
interceptProjectiles_andUnderDistance: 1500


[turret_xyi]
#turret
x: 0
y: 0
canShoot:false
image:null.png

resourceUsage: ammo=1
idleDir:180


[turret_radar]
image:Tor_Radar.png
attachedTo: 2
slave: true
y:-20
x:0
idleSpin:4
canShoot:false

resourceUsage: ammo=1


[projectile_1]
#TOW
directDamage: 500
life: 500
speed: 4.5
targetSpeed:13.5
targetSpeedAcceleration:0.08
frame: 5
areaDamage: 4000
areaRadius: 120
image:ROOT:/PNG/9m338.png
drawSize: 0.65
explodeEffect:shockwave, smallExplosion
#trailEffect: true
trailEffect: CUSTOM:projectileTrail
trailEffectRate:0.5
tags:missile

ballistic: true
ballistic_delaymove_height:50
ballistic_height: 50

autoTargetingOnDeadTarget:true


retargetingInFlight:true
retargetingInFlightSearchDelay:1.5
retargetingInFlightSearchRange:90
retargetingInFlightSearchOnlyTags:FalseTargetAir

[effect_projectileTrail]
priority:critical

stripIndex: effects
frameIndex: 0


life: 500
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime:1.5
scaleFrom: 0.5
scaleTo: 0.5
alpha: 1
drawUnderUnits:false

atmospheric:true


shadow:false
yOffsetRelative: -20
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2





[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 0.9
turnAcceleration: 0.50

moveSlidingMode :false
moveIgnoringBody:false


[hiddenAction_start]
autoTriggerOnEvent: created
addResources:ammo=16,fuel=200


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1) and self.resource(type='ammo',lessThan=16)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 20s
addResources:ammo=1

[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true


[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.3

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=130) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=2


[action_ammo1]
isLocked:true
isVisible:if self.resource(type='ammo',greaterThan=0)
#isActive: false
text: ammo
text_ru: Боезапас
description: -
description_ru: Сколько осталось боезапаса
iconImage:ROOT:/PNG/Ammunition.png
addResources: ammo=1
price:  ammo=1

buildSpeed: 0s
pos: 0.2
displayRemainingStockpile: true
displayType: infoOnlyStockpile



[action_trigger_up]
autoTrigger:if self.isMoving()
text: Опустить люки
convertTo:Tor_Un
isVisible:false

















































































