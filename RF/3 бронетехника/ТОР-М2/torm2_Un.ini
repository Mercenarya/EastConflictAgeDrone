maxHp: 400
mass: 3000
armour:56
armourMinDamageToKeep:0
displayText: TOR-M2
displayText_ru: ЗРК ТОР-М2
displayDescription: TOR-M2 \n Soviet-Russian short-range anti-aircraft missile system (SAM) that is good at shooting down both missiles and aircraft \n Don't forget to replenish it and it will keep you happy n As cool as our Alemzhou 
displayDescription_ru: ТОР-М2  \n Советско-российский зенитный ракетный комплекс (ЗРК) малой дальности, что хорошо сбивает как ракеты, так и авиацию \n Не забывайте пополнять его и он будет радовать вас \n Так же крут, как наш Алемжоу 
