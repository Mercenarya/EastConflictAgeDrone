
[core]
name: S300_roc
displayText: S-300PS 'Favorit'  
displayText_ru:  С-300ПС 'Фаворит' 
displayDescription_ru: Самоходный зенитно-ракетного комплекса С-300П (SA-10 Grumble) , данный комплекс представлен пусковой установкой 5П85С с 4 ракетами , а также радар наведения ракет на цель , 30Н6Е. 
displayDescription: Self-propelled surface-to-air missile system S-300P (SA-10 Grumble), this complex is represented by launcher 5P85S with 4 missiles, as well as missile targeting radar, 30N6E. 

class: CustomUnitMetadata
price: 15000,Oil=3000,Ammo=12000
maxHp: 180
mass: 300000
armour:12

techLevel: 2
buildSpeed: 0.0012
#availableInDemo: true

radius: 30
displayRadius: 70

energyMax: 3
energyRegen: 0.004
energyNeedsToRechargeToFull: true
transportSlotsNeeded:200000

isBio: false
softCollisionOnAll: 0

fogOfWarSightRange:6

[graphics]
icon_zoomed_out_neverShow:true
total_frames: 1

imageScale:0.72
image: S300_PMU2.png
image_wreak:  NONE
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true 


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
turretRotateWithBody: true

turretSize: 12
turretTurnSpeed: 5
maxAttackRange: 1800
shootDelay: 300


[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.03

maxTurnSpeed: 0.3
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false




[action_trigger_start]
autoTrigger:if numberOfUnitsInTeam(withTag='dar',greaterThan=0)

isVisible:false
showMessageToAllPlayers:ОТРК на поле боя
temporarilyRemoveTags:dar

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=150,ammo=4

[action_Fuel]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: Fuel Gauge
description_ru: Остаток топлива

iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_FuelUsage]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.5

[action_trigger_LowOnFuel]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_FuelEmpty]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_FuelIsEmpty]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=200) and self.queueSize(lessThan=1)
alsoQueueAction:Refueling

[hiddenAction_Refueling]
buildSpeed: 1
addResources: fuel=3

[action_set]
convertTo: S300_roc_fire

text: Deploy PU
text_ru: Развернуть ПУ



































