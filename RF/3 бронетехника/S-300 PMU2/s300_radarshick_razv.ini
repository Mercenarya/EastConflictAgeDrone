[core]
tags:radar,s300psradar
name: S300_radar_goool
displayText: 30Н6Е (Flap Lid)
displayText_ru: 30Н6Е
displayDescription_ru: Радар сопровождения цели для наведения для неё ракет комплекса С-300. \n Максимальная дальность обнаружения 300 километров. 
displayDescription: Target tracking radar for targeting S-300 missiles. \The maximum detection range is 300 kilometers. 

class: CustomUnitMetadata
price: 2
maxHp: 180
mass: 300000
armour:12

techLevel: 2
buildSpeed: 0.0012
#availableInDemo: false
showInEditor:false

radius: 30
displayRadius: 70

energyMax: 3
energyRegen: 0.004
energyNeedsToRechargeToFull: true
transportSlotsNeeded:200000

isBio: false
softCollisionOnAll: 0

fogOfWarSightRange:6

[graphics]
icon_zoomed_out_neverShow:true
total_frames: 1

scaleTurretImagesTo: 36

imageScale:0.72
image: radar_main.png
image_wreak:  NONE
image_turret: radar_goool.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true 


[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: false
canAttackUnderwaterUnits: false
turretRotateWithBody: false

turretSize: 12
turretTurnSpeed: 5
maxAttackRange: 4500
shootDelay: 300
showRangeUIGuide: true




[turret_2]
x:0
y:2.5
canShoot:false


[turret_1]
#pac3
x: 0
y: 3
attachedTo:2
slave:true
invisible:true
delay:1.9s
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
warmup:0.1s

projectile: 1

[projectile_1]
directDamage: 0
targetGround:true
life: 100
frame: 4
speed: 100
drawSize: 0.001
spawnUnit: ZasvetAir*1
explodeEffect:none



[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.01





[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=150

[action_Fuel]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: Fuel Gauge
description_ru: Остаток топлива

iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_FuelUsage]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.5

[action_trigger_LowOnFuel]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_FuelEmpty]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_FuelIsEmpty]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=200) and self.queueSize(lessThan=1)
alsoQueueAction:Refueling

[hiddenAction_Refueling]
buildSpeed: 1
addResources: fuel=3

[action_set]
convertTo: S300_radar
text: Deploy PU
text_ru: Свернуть

