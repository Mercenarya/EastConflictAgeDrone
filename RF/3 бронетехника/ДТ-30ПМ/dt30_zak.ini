
[core]
copyFrom:ROOT:/template/ammo.template
name: DT30PMZ
tags: armor,noarmor

#overrideAndReplace: tank

class: CustomUnitMetadata
price: 400,Oil=5000,Ammo=150
maxHp: 180
mass: 3000
armour:30
armourMinDamageToKeep:0
displayText: DT-30PM (zzz)
displayText_ru: ДТ-30ПМ (Хвостовая)
displayDescription: Light APC, armed with 7.62mm PKT machine gun
displayDescription_ru: Лёгкая инженерная машина, вооружена 7.62мм пулемётом ПКТ
fogOfWarSightRange: 10
techLevel: 1
buildSpeed: 10s
#availableInDemo: true
transportSlotsNeeded: 31
maxTransportingUnits: 0

radius: 20
displayRadius: 35



isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:/ogg/rf/btr80.OGG

energyMax: 50
energyRegen: 1
energyNeedsToRechargeToFull: true


[graphics]
total_frames: 1

image:        dt30pm_xvostovoe.png
image_wreak:  none
image_turret: none
scaleImagesTo: 53

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0

splastEffect: true
[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false



turretSize: 20
turretTurnSpeed: 2.5

maxAttackRange: 250
shootDelay: 7


turretMultiTargeting: true

[movement]
movementType: HOVER
moveSpeed: 0
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 1
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false




[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=160) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=2






[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withinRange=150,greaterThan=1) and self.queueSize(lessThan=1) and self.resource(type='ammo',greaterThan=1) and self.tags(includes='ammo') 
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:ammo=-2


[hiddenAction_emptyAmmo1]
autoTrigger:if self.resource(type='ammo',lessThan=1)
temporarilyRemoveTags:ammo

[action_da]
text_ru:Разрешить подачу боеприпасов 
text:Authorise ammunition supply 
isLocked:if self.resource(type='ammo',lessThan=1) 
temporarilyAddTags:ammo
isVisible: if self.hasFlag(id=1) and not self.hasFlag(id=4) and self.resource(type='ammo',greaterThan=1)

addResources: setFlag=2, unsetFlag=1

[action_net]
text_ru:Прекратить подачу боеприпасов 
text:Stop supplying ammunition 
temporarilyRemoveTags:ammo
isVisible: if self.hasFlag(id=2) and not self.hasFlag(id=4)
addResources: setFlag=1, unsetFlag=2


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: fuel=70,setFlag=1




[action_zagryzkaBK]
text:Load ammunition
text_ru:Загрузить БК
isVisible:if self.resource(type='ammo',lessThan=1)
isLocked:if not numberOfUnitsInTeam(withTag='skladbk', greaterThan=0,withinRange=120)
alsoQueueAction:zagryzkaBK1
buildSpeed: 0.1s
addActionCooldownTime:60s



[action_zagryzkaBK1]
isVisible:false
buildSpeed: 30s
addResources:ammo=100






