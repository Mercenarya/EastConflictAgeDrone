
[core]
tags:transporting,d30un
name: D30_move
showInEditor: false
displayText: D-30
displayText_ru: Д-30
displayDescription: 122mm Howitzer
displayDescription_ru: 122мм Гаубица
class: CustomUnitMetadata
price: 9000,Ammo=1700
