

[core]
name: Su34R
displayText: Su-34
displayText_ru: Су-34
displayDescription: Russian 4Gen bomber
displayDescription_ru: Российский бомбардировщик четвертого поколения
class: CustomUnitMetadata
price: 200000
maxHp: 1000
armour:100
armourMinDamageToKeep:1

energyMax:10000
energyRegen:5
energyNeedsToRechargeToFull:true
showInEditor: false
tags:AirT1RF,AirT2RF,LightStrikeAirRF,StrikeAirRF,HeavyStrikeAirRF,air,AirFHT,su24,StrikeAirRF1,500ympk,AirT3RF,kab1500,kab500,grom1e,d30sn,zapravka,AirT4RF,X-38,3000ympk
mass: 10000
transportSlotsNeeded:1

techLevel: 1
buildSpeed: 30s

radius: 85

isBio: false
softCollisionOnAll: 75
numBitsOnDeath: 5

fogOfWarSightRange: 32

dieOnZeroEnergy:true
explodeOnDeathGroundCollision:true

[graphics]
total_frames: 1
imageScale: 0.5

teamColorsOnTurret: true

image:        Su34.png
image_wreak:  Su34_dead.png
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:false
canAttackUnderwaterUnits: false

attackMovement:bomber

turretSize: 20
turretTurnSpeed: 40

aimOffsetSpread:0
maxAttackRange: 440
shootDelay: 0.22s

[turret_1]
x: 0
y: 0
canShoot:false
limitingAngle:25



[movement]
movementType: AIR
moveSpeed: 4.5
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
#landOnGround:true

maxTurnSpeed: 0.9
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25

reverseSpeedPercentage:0

slowDeathFall:true
#self.hasParent(withTag="SU34") and
[action_trigger_0_energy]
isVisible:false
autoTrigger: if self.energy(lessThan=450)
clearAllWaypoints:true
addWaypoint_prepend:true
addWaypoint_type: loadInto
addWaypoint_target_nearestUnit_tagged: "aero"
addWaypoint_target_nearestUnit_team:ally


[action_zapravka2]
autoTrigger: if self.isFlying()
convertTo: Su34
isVisible:false





[hiddenAction_FHTIncoming]
