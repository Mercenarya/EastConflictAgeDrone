
[core]
name: MIG31R
displayText: MiG-31BМFoxhound
displayText_ru: МиГ-31БМ
displayDescription: Soviet and Russian multirole fighter of the fourth generation
displayDescription_ru: Советский и российский многоцелевой истребитель четвёртого поколения
class: CustomUnitMetadata
price: 1
maxHp: 1700
armour:100
armourMinDamageToKeep:1
showInEditor:false
energyMax: 5000
energyRegen:5
energyNeedsToRechargeToFull:true
tags:air,AirFHT,zapravka

mass: 10000
transportSlotsNeeded:1

techLevel: 1
buildSpeed: 30s

radius: 24

isBio: false
softCollisionOnAll: 75
numBitsOnDeath: 5

fogOfWarSightRange: 32

dieOnZeroEnergy:true
explodeOnDeathGroundCollision:true

[graphics]
total_frames: 1
imageScale: 0.6

teamColorsOnTurret: true

image:        mig31.png
image_wreak:  Mig29_dead.png
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

attackMovement:bomber

turretSize: 20
turretTurnSpeed: 40

aimOffsetSpread:0
maxAttackRange: 340
shootDelay: 0.15s

[turret_1]
x: 0
y: 0
canShoot:false
limitingAngle:25



[movement]
movementType: AIR
moveSpeed: 3
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
#landOnGround:true

maxTurnSpeed: 0.9
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25

reverseSpeedPercentage:0

slowDeathFall:true





[action_zapravka2]
autoTrigger: if self.isFlying()
convertTo: MIG31
isVisible:false



[hiddenAction_FHTIncoming]
autoTrigger: if self.resource(type='FHT',lessThan=60) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFHT

[hiddenAction_LoadFHT]
buildSpeed: 0.3s
addResources:  FHT=1



