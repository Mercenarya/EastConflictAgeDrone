

[core]
copyFrom: ROOT:template\EasyRadar\copyFrom\radar.copyFrom

@global EZRD_timeBetween: 5.5

@global EZRD_revealerUnit: RadarBlip

@global EZRD_Range: 4000

@global EZRD_Tag: air,a50tag
name: A50
displayText: A-50
displayText_ru: A-50 «Шмель»
displayDescription:Soviet Russian long-range radar detection and control aircraft
displayDescription_ru: Советский Российский самолёт дальнего радиолокационного обнаружения и управления.\n А-50 может применяться для обнаружения и сопровождения воздушных и надводных целей, \n оповещения командных пунктов автоматизированных систем управления видов Вооружённых Сил о воздушной и надводной обстановке, \n применяться для управления самолётами истребительной и ударной авиации при их наведении на воздушные, \n наземные и морские цели, а также служить воздушным командным пунктом. 
class: CustomUnitMetadata
price: 52000,Oil=27200
maxHp: 4000
armour:115
armourMinDamageToKeep:1



energyMax:15000
energyRegen:-0.3
energyNeedsToRechargeToFull:true
tags: AIR,AirFHT

mass: 10000
transportSlotsNeeded:4
maxTransportingUnits: 0
transportUnitsBlockOtherTransports:false
techLevel: 2
buildSpeed: 45s

radius: 120
displayRadius: 200
isBio: false
softCollisionOnAll: 75
numBitsOnDeath: 5

fogOfWarSightRange: 25

dieOnZeroEnergy:true
explodeOnDeathGroundCollision:true
autoTriggerCooldownTime:0.2s

[effect_trail] 
life: 50 
image:ROOT:/PNG/Trail.png 
color: #CCCCDD 
 
priority: verylow 
 
attachedToUnit: false 
atmospheric: true 
physics: false 
physicsGravity: 0 
 
xOffsetRelative: 170
yOffsetRelative: -35
xSpeedRelative: 0 
ySpeedRelative: 0 
 
scaleFrom: 0.3 
scaleTo: 0.3 
 
alpha: 0.75 
 
 
[effect_trail2] 
life: 50 
image:ROOT:/PNG/Trail.png 
color: #CCCCDD 
 
priority: verylow 
 
attachedToUnit: false 
atmospheric: true 
physics: false 
physicsGravity: 0 
 
xOffsetRelative: -170
yOffsetRelative: -35
xSpeedRelative: 0 
ySpeedRelative: 0 
 
scaleFrom: 0.3 
scaleTo: 0.3 
 
alpha: 0.75 
 
[graphics]
total_frames: 1
imageScale: 0.9

teamColorsOnTurret: true

image:        pon.png
image_wreak:  IL76_dead.png
image_turret: radar.png

image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2

movementEffect: CUSTOM:trail, CUSTOM:trail2
movementEffectRate: 2


[decal_sweepLine]
@define SweepTimeMultiplier: 72
onlyWhenSelectedByOwnPlayer: true
drawLineTo: self.getOffsetRelative(y=${EZRD_Range}, dirOffset=self.timeAlive*${SweepTimeMultiplier})
color: #00FF00
#This one is purely decorative

[attack]


canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

maxAttackRange: ${EZRD_Range}
#${EZRD_Range}
showRangeUIGuide: true
#This shows radar range if only one radar is selected



[turret_2]
x:0
y:-5
idleSpin:0.5

[movement]
movementType: AIR
moveSpeed: 2.6
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0
#landOnGround:true
maxTurnSpeed: 0.4
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25


reverseSpeedPercentage:0

slowDeathFall:true



[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true



[hiddenAction_start]
autoTriggerOnEvent: created
addResources: ammo=100


[action_zapravka2]
autoTrigger: if not self.isFlying()
convertTo: A50R
isVisible:false









