

[core]
name: Su35R
displayText: Su-35C
displayText_ru: Су-35С
displayDescription: Russian multirole fighter of the 4++ generation \n Capable of using guided air-to-air and air-to-surface weapons.
displayDescription_ru: Российский многоцелевой истребитель поколения 4++ \n Способен применять управляемое вооружение воздух-воздух и воздух-поверхность.
class: CustomUnitMetadata
price: 200000
maxHp: 1000
armour:100
armourMinDamageToKeep:1

energyMax:5000
energyRegen:5
energyNeedsToRechargeToFull:true
showInEditor: false
tags:AirT1RF,AirT2RF,AirT3RF,LightStrikeAirRF,air,AirFHT,zapravka,AirT3RF,AirT4RF,su35
mass: 10000
transportSlotsNeeded:1

techLevel: 1
buildSpeed: 30s

radius: 85

isBio: false
softCollisionOnAll: 75
numBitsOnDeath: 5

fogOfWarSightRange: 32

dieOnZeroEnergy:true
explodeOnDeathGroundCollision:true

[graphics]
total_frames: 1
imageScale: 0.5

teamColorsOnTurret: true

image:        su35c.png
image_wreak:  su35c_dead.png
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:2
shadowOffsetY:2

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:false
canAttackUnderwaterUnits: false

attackMovement:bomber

turretSize: 20
turretTurnSpeed: 40

aimOffsetSpread:0
maxAttackRange: 340
shootDelay: 0.15s

[turret_1]
x: 0
y: 0
canShoot:false
limitingAngle:25



[movement]
movementType: AIR
moveSpeed: 4.5
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
#landOnGround:true

maxTurnSpeed: 0.9
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25

reverseSpeedPercentage:0

slowDeathFall:true
#self.hasParent(withTag="SU27") and
[action_trigger_0_energy]
isVisible:false
autoTrigger: if self.energy(lessThan=450)
clearAllWaypoints:true
addWaypoint_prepend:true
addWaypoint_type: loadInto
addWaypoint_target_nearestUnit_tagged: "aero"
addWaypoint_target_nearestUnit_team:ally


[action_zapravka2]
autoTrigger: if self.isFlying()
convertTo: Su35
isVisible:false





[hiddenAction_FHTIncoming]
autoTrigger: if self.resource(type='FHT',lessThan=60) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFHT

[hiddenAction_LoadFHT]
buildSpeed: 0.3s
addResources:  FHT=1

