attackMovement:bomber

turretSize: 20
turretTurnSpeed: 40

aimOffsetSpread:0
maxAttackRange: 440
shootDelay: 0.22s

[turret_1]
x: 0
y: 0
canShoot:false
limitingAngle:25



[movement]
movementType: AIR
moveSpeed: 4.5
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
#landOnGround:true

maxTurnSpeed: 0.9
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false
moveSlidingDir:  25

reverseSpeedPercentage:0

slowDeathFall:true
