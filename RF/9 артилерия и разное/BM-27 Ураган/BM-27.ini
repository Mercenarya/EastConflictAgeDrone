
[core]
tags:noarmor,bm27
#overrideAndReplace: tank
name: BM-27
class: CustomUnitMetadata
price: 78000,Ammo=19000,Oil=12000
maxHp: 120
mass: 3000
armour:12
armourMinDamageToKeep:0
displayText: BM-27 "Hurricane"
displayText_ru: БМ-27 "Ураган"
displayDescription: The Soviet 220mm Uragan MLRS is based on the ZIL-135 chassis, which has high cross-country capability and mobility. \n It has high firepower, which allows it to cause significant damage to the enemy at a range of up to 35 kilometers. \n In the salvo of one combat vehicle there are 16 missiles. 
displayDescription_ru: Советское 220мм РСЗО Ураган создано на шасси ЗИЛ-135 , обладающее высокой проходимостью и мобильностью. \n Имеет высокой огневой мощью , что позволяет наносить существенный ущерб противнику на дальности до 35 километров. \n В залпе одной боевой машины находится 16 ракет. 

techLevel: 1
buildSpeed: 35s
#availableInDemo: true

radius: 35
displayRadius: 45
isBio: false
softCollisionOnAll: 3

energyMax: 1200
energyRegen: 0.15
energyNeedsToRechargeToFull: true
transportSlotsNeeded: 42

fogOfWarSightRange:8

canRepairBuildings: false
canRepairUnits : false
autoRepair: false

selfRegenRate:0.1
nanoRange: 100
nanoBuildSpeed: 2.0
#soundOnMoveOrder:ROOT:/ogg/rf/URAL.OGG

maxTransportingUnits:3
transportUnitsRequireTag:TANKIST
stayNeutral:true
transportUnitsKillOnDeath:false
whileNeutralTransportAnyTeam:true
whileNeutralConvertToTransportedTeam:true
transportUnitsCanUnloadUnits:if not self.isControlledByAi()

[hiddenAction_vehicleEmpty]
autoTrigger:if self.transportingCount() == 0
clearActiveWaypoint:true
switchToNeutralTeam:true

[hiddenAction_ii]
autoTrigger:if self.isOnNeutralTeam() and self.transportingCount() >= 1
startUnloadingTransport:true

[hiddenAction_addCrew]
autoTriggerOnEvent:created
addUnitsIntoTransport:TANKMENRU*2,navodchik_rus_uragan*1


[graphics]
total_frames: 1

image:        bm27.png
image_wreak:  NONE
image_turret: pu.png
scaleImagesTo:70
scaleTurretImagesTo:42.5
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

dustEffect: true
imageScale: 0.5

[attack]

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 20
turretTurnSpeed: 0.7
maxAttackRange: 2290
shootDelay: 1



[turret_2]
x: 0
y: -21.5

canShoot: false
idleDir:180





[hiddenAction_start]
autoTriggerOnEvent: created
addResources:9M27F=16,9M27K=16,9M27K2=16,setFlag=1,fuel=70


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:9M27F=1,9M27K2=1

[movement]
movementType: LAND
moveSpeed: 1.3
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.05

maxTurnSpeed: 1
turnAcceleration: 0.04

moveSlidingMode :false
moveIgnoringBody:false

[ai]
useAsBuilder: true



[action_peredacha]
text:Передать юнита в другую команду
description: Аккуратнее, юнита могут забрать враги,рядом не должно находится других ваших юнитов, только юниты той команды, в которую вы хотите передать
switchToNeutralTeam:true
ai_isDisabled:true





[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.2

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=70) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=1



[action_1]
text_ru: Развернуть
buildSpeed:5s
convertTo:BM-27_raz
whenBuilding_cannotMove: true










































