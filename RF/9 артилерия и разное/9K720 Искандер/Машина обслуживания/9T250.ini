[movement]
movementType: LAND
moveSpeed: 0.8
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.03

maxTurnSpeed: 0.3
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false

[ai]
useAsBuilder: true



#(((REIHAN)))

[attachment_gun]
x: -50
y: 0
addTransportedUnits:true
canBeAttackedAndDamaged: true
isUnselectable: true
keepAliveWhenParentDies:false
rotateWithParent:true
lockRotation:true
deattachIfWantingToMove:true
setDrawLayerOnTop:false




[hiddenAction_start]
autoTriggerOnEvent: created
addResources: 9m723HE=2,fuel=150,setFlag=1,setFlag=2 

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.5

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=200) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=3





[action_trigger_full]
autoTrigger:if self.transportingUnitWithTags(includes='fullBK')
isVisible:false
startUnloadingTransport:true
temporarilyRemoveTags:loading

[action_trigger_fullLeft]
autoTrigger:if self.transportingUnitWithTags(includes='fullBKleft')
isVisible:false
temporarilyRemoveTags:loadingLeft



[hiddenAction_LoadOTRKl]
buildSpeed: 18s
addResources: 9m723HE=-1,setFlag=4,unsetFlag=2

[hiddenAction_LoadOTRKr]
buildSpeed: 18s
addResources: 9m723HE=-1,setFlag=3,unsetFlag=1



[action_trigger_loadBKleft]
autoTrigger:if self.transportingUnitWithTags(includes='emptyBKleft') and self.resource(type='9m723HE',greaterThan=0) and self.queueSize(lessThan=1) and self.hasFlag(id=2)
#buildSpeed: 18s
isVisible:false
playAnimation: siloOpen1
alsoQueueAction:LoadOTRKl
temporarilyAddTags:loadingLeft


[action_trigger_loadBKright]
autoTrigger:if self.transportingUnitWithTags(includes='emptyBKright') and self.resource(type='9m723HE',greaterThan=0) and self.queueSize(lessThan=1) and self.hasFlag(id=1)
#buildSpeed: 1
isVisible:false
playAnimation: siloOpen2
alsoQueueAction:LoadOTRKr
temporarilyAddTags:loadingRight




[action_trigger_notammo]
autoTrigger:if self.resource(type='9m723HE',lessThan=1)
isVisible:false
#temporarilyAddTags:loadingRight
temporarilyRemoveTags:loadingRight,loadingLeft

[action_trigger_notgo]
autoTrigger:if self.transportingUnitWithTags(includes='9k720')
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true


[action_trigger_go]
autoTrigger:if not self.transportingUnitWithTags(includes='9k720')
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}
isVisible:false








































