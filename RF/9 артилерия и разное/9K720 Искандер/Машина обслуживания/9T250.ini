name: 9t250
class: CustomUnitMetadata
price: 34000,Ammo=25000,Oil=11000
maxHp: 700
mass: 3000
armour:12
armourMinDamageToKeep:0
explodeOnDeathGroundCollision:true
displayText: 9T250 (Ammo for Iskander)
