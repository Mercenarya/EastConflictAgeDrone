
[core]
tags:noarmor
showInEditor:false
name: Bastion_move
displayText: K300 "Bastion"
displayText_ru: К300 «Бастион» 
displayDescription: The K300 Bastion coastal missile system \n is capable of striking land and surface targets at a range of up to 800 kilometers \n using P-800 Onyx missiles with speeds up to Mach 2.6. 
displayDescription_ru: Береговой ракетный комплекс К300 «Бастион» \n способен наносить удары по-наземным и надводным целям на дальности до 800 километров \n с помощью ракет П-800 «Оникс» , развивающих скорость до 2,6 числа маха. 

class: CustomUnitMetadata
price: 70000,Ammo=30000,Oil=11000
maxHp: 700
mass: 30000
maxTransportingUnits: 0
transportSlotsNeeded:130
techLevel: 2
buildSpeed: 95s
#availableInDemo: true

radius: 30
displayRadius: 70

fogOfWarSightRange:8
isBio: false
softCollisionOnAll: 0



[action_upgradeT2]
convertTo: bastion
price:  0
text: Decomposition of the gun
text_ru: Развернуться
whenBuilding_playAnimation: siloOpen1


displayType: upgrade
buildSpeed: 35s


[graphics]
total_frames: 1

image:        bastion.png
image_wreak:  none
image_turret: null.png

scaleTurretImagesTo: 13
imageScale:0.57

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 0
animation_moving_speed: 0


dustEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

[turret_RRR]
#nuke turret
canShoot: false

x: 7
y: -28
invisible:if self.hasFlag(id=3)

[turret_LLL]
#nuke turret
canShoot: false

x: -7.5
y: -28
invisible:if self.hasFlag(id=4)

[arm_1]
x:-8
y:-23
image_end:dver_l.png
drawOverBody:true

[arm_2]
x:8
y:-23
image_end:dver_p.png
drawOverBody:true


[animation_siloOpen1]

#pingPong: true
#blendIn: 0.5s
#blendOut: 4.0s

arm1_0s:  {x:0, y:0}

arm1_6s: {x:0, y:0}

arm1_12s: {x:0,  y:0}


arm1_35s: {x:0,  y:0}

#arm1_40s: {x:0,  y:0}


#1234567890

arm2_0s:   {x:0, y:0}

arm2_6s:  {x:0, y:0}

arm2_12s:  {x:0, y:0}

arm2_35s:  {x:0, y:0}

#arm2_40s:  {x:0, y:0}


[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.03

maxTurnSpeed: 0.3
turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false




[action_trigger_start]
autoTrigger:if numberOfUnitsInTeam(withTag='dar',greaterThan=0)

isVisible:false
temporarilyRemoveTags:dar

[hiddenAction_start]
autoTriggerOnEvent: created
addResources: setFlag=1,setFlag=2,9m723HE=2,fuel=450

[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.5

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=200) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=3





[action_trigger_notfullleft]
autoTrigger:if self.hasFlag(id=4) and not self.hasFlag(id=3)
isVisible:false

temporarilyRemoveTags:fullBKleft,fullBK
temporarilyAddTags:emptyBKleft


[action_trigger_notfullright]
autoTrigger:if self.hasFlag(id=3) and not self.hasFlag(id=4)
isVisible:false

temporarilyRemoveTags:fullBKright,fullBK
temporarilyAddTags:emptyBKright


[action_trigger_empty]
autoTrigger:if self.hasFlag(id=4) and self.hasFlag(id=3)
isVisible:false

temporarilyRemoveTags:fullBK
temporarilyAddTags:emptyBK,emptyBKright,emptyBKleft


[action_trigger_full]
autoTrigger:if not self.hasFlag(id=4) and not self.hasFlag(id=3)
isVisible:false

temporarilyRemoveTags: emptyBK
temporarilyAddTags: fullBK



[action_trigger_loadBK]
autoTrigger:if self.hasParent(withTag="loadingLeft") and self.queueSize(lessThan=1) and self.hasFlag(id=4) and self.hasFlag(id=3)
buildSpeed: 1
isVisible:false
playAnimation: siloOpen1
alsoQueueAction:LoadOTRKl


[action_trigger_loadBK2]
autoTrigger:if self.hasParent(withTag="loadingRight") and self.queueSize(lessThan=1) and self.hasFlag(id=3) and not self.hasFlag(id=4)
buildSpeed: 1
isVisible:false
playAnimation: siloOpen1
alsoQueueAction:LoadOTRKr


[action_trigger_loadBK3]
autoTrigger:if self.hasParent(withTag="loadingLeft") and self.queueSize(lessThan=1) and self.hasFlag(id=4) and not self.hasFlag(id=3)
buildSpeed: 1
isVisible:false

playAnimation: siloOpen1

alsoQueueAction:LoadOTRKl




[hiddenAction_LoadOTRKl]
buildSpeed: 17.6s
addResources: 9m723HE=1,setFlag=2,unsetFlag=4
temporarilyRemoveTags: emptyBKleft
temporarilyAddTags: fullBKleft

[hiddenAction_LoadOTRKr]
buildSpeed: 17.6s
addResources: 9m723HE=1,setFlag=1,unsetFlag=3
temporarilyRemoveTags: emptyBKright
temporarilyAddTags:fullBKright











































