
[core]

name: 2s4
tags: armor,noarmor

#overrideAndReplace: heavyTank

class: CustomUnitMetadata
price: 15052, Ammo=7000,Oil=2300
maxHp: 300
mass: 3000
armour:42
armourMinDamageToKeep:0
displayText: 2S4
displayText_ru: 2С4 «Тюльпан»
displayDescription: (ACV)\Armed with a 240mm mortar.
displayDescription_ru:  советский 240-мм самоходный миномёт особой мощности. 
fogOfWarSightRange: 7
techLevel: 2
buildSpeed:15s
#availableInDemo: true
transportSlotsNeeded: 52
maxTransportingUnits: 0

radius: 25
displayRadius: 32


isBio: false
softCollisionOnAll: 0
#soundOnMoveOrder:ROOT:/ogg/rf/bmd.OGG

energyMax: 350
energyRegen: 0.8
energyNeedsToRechargeToFull: true


[graphics]
total_frames: 1

image:        baza2.png
image_wreak:  dead.png
image_turret: null.png

scaleImagesTo: 39


image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 0


splastEffect: true



[attack]
canAttack: false
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false



turretTurnSpeed: 1.6

maxAttackRange: 1670
shootDelay: 15

turretMultiTargeting: true






[hiddenAction_start]
autoTriggerOnEvent: created
addResources:120nonaHE=12,setFlag=1,fuel=90


[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 10s
addResources:120nonaHE=1





[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15

maxTurnSpeed: 0.5

turnAcceleration: 0.02

moveSlidingMode :false
moveIgnoringBody:false



[action_svernyt]
text:Развернуть
pos:0.1
convertTo: 2s4_dep
buildSpeed:5s




[action_fuelCUm]
isLocked:true
isVisible:if self.resource(type='fuel',greaterThan=0)
#isActive: false
text: Fuel
text_ru: Топливо
description: -
description_ru: Не сливать соляру!
iconImage:ROOT:/PNG/fuel.png
addResources: fuel=1
price:  fuel=1

buildSpeed: 0s
pos: 0.1
displayRemainingStockpile: true
displayType: infoOnlyStockpile


[action_trigger_yarikblyat]
autoTrigger:if self.isMoving() and not self.isControlledByAI()
isVisible:false
addResources: fuel=-0.3

[action_trigger_yarikblyatrulinahui]
autoTrigger:if self.resource(type='fuel',lessThan=1)
isVisible:false
setUnitStats:maxTurnSpeed=0,moveSpeed=0
clearAllWaypoints:true

[action_trigger_yarikblyatrulinahuiuraaa]
autoTrigger:if self.resource(type='fuel',greaterThan=0)
isVisible:false
setUnitStats:maxTurnSpeed=${movement.maxTurnSpeed},moveSpeed=${movement.moveSpeed}

[hiddenAction_fuelIncoming]
autoTrigger: if  numberOfUnitsInTeam(withTag='Fuel',withinRange=100,greaterThan=0) and self.resource(type='fuel',lessThan=90) and self.queueSize(lessThan=1)
alsoQueueAction:LoadFuel

[hiddenAction_LoadFuel]
buildSpeed: 1
addResources: fuel=2


































