isVisible:false 
deleteSelf:true
#========Прочее========#

[action_luki_otritiy]
autoTrigger:if self.numberOfUnitsInTeam(withTag='luki_otkrity',greaterThan=0,withinRange=50)
setUnitStats:moveSpeed = 0.9
isVisible:false


[action_luki_zakrity]
autoTrigger:if self.numberOfUnitsInTeam(withTag='luki_otkrity',lessThan=1,withinRange=50)
setUnitStats:moveSpeed = 1.2

isVisible:false


#============Сообщения===========#

[action_trigger_600health]
autoTrigger: if self.hp <= 600 and self.resource(type='hydra',greaterThan=1)
showMessageToPlayer:Критические повреждения корабля! БЧ-2 начать ремонтные работы для поддержания корабля на плаву!
isVisible: false
addResources: setFlag=11,hydra=-2

[action_triggerhealth]
autoTrigger:if self.HasFlag(id=11)
isVisible: false
setUnitStats:selfRegenRate=0.1


[action_trigger_stopstart]
autoTrigger:if self.hp(greaterThan=999) and self.hasFlag(id=11)
setUnitStats:selfRegenRate=0
addResources:unsetFlag=11
isVisible:false


