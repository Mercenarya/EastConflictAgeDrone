


[core]
name: bdk775
displayText: Large Landing Ship Pr.775/2 (Novocherkassk)
displayText_ru: БДК Пр.775/2 (Новочеркасск)
displayDescription: Large Landing Ship Project 775/2 ‘Novocherkassk’ \n 2 Cannons, 2 122mm MLRS, 2 ‘Igla’ SAMs.  \n No cruise missiles, poor defence \n Not bad artillery armament, almost no air defence \n Can carry up to 10 tanks or 340 men \n 4 57mm guns on two turrets \n HUGE rate of fire, damage and penetration is shit. \The Bdk Novocherkassk was sunk in the winter of 23... God save our Black Sea Fleet!
displayDescription_ru: Большой десантный корабль Проекта 775/2 "Новочеркасск" \n 2 Пушки, 2 122мм РСЗО, 2 ЗРК "Игла"  \n Крылатые ракеты отсутствуют, скудное оборонительное \n Неплохое артиллерийское вооружение, практически полное отсутствие ПВО \n Может перевозить до 10 танков или 340 человек \n 4 57мм орудия на двух башнях, \n ОГРОМНАЯ скорострельность, урон и пробитие говно. \n Бдк Новочеркасск был потоплен зимой 23 года... Господи, храни наш ЧФ флот!
