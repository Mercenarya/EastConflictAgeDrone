displayDescription: Russian tank support fighting vehicle\n Good armor, Relic dynamic protection\nArmament: 2x 30mm autocannon 2A42\n 9M120 "Ataka" ATGM, 2x 30mm AGS-17 grenade launcher \n Poor hull traverse speed \n Speed reaches 50 Kmph \n Russian bias, no matter how you look at it, 2 30mm cannons destroy all infantry and lightly armored vehicles, ATGMs destroy even tanks, and AGS grenade launchers destroy everything alive!\n It's very expensive, but it's worth it
displayDescription_ru: Российская боевая машина поддержки танков\n Хорошая броня, имеется динамическая защита "Реликт"\nВооружение: 2х 30мм Автопушки 2А42\n ПТУР 9М120 "Атака", 2х 30мм гранатомета АГС-17 \n Плохая скорость поворота корпуса \n Скорость достигает 50 Км/ч \n Имба, как не посмотри, 2 30мм пушки уничтожают всю пехоту и легкобронированную технику, ПТУР уничтожает даже танки, а гранатомёты АГС уничтожают вообще все живое!\n и востали мошыны из пепла ядерного огня... \n Уж очень дорого, но того стоит

