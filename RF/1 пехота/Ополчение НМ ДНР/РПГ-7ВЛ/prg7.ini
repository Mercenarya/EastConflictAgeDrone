
[core]
copyFrom:ROOT:/template/Infantry.template
name:T1_rus_rpg7vl_dpr
class: CustomUnitMetadata
#overrideAndReplace: antiAirTurret
price: 85
maxHp: 100
mass: 30
displayText: AT support (NM DPR)
displayText_ru: Гранатометчик (НМ ДНР)
displayDescription: -6B13 body armor \n Armed with an AK-74 \n-Has RPG-7VL \n-War veterans
displayDescription_ru: -Бронежилет 6Б13 \n Вооружен АК-74 \n-Имеется РПГ-7ВЛ \n-Ветераны войны
techLevel: 1
buildSpeed: 0.003
#availableInDemo: true
fogOfWarSightRange: 16
radius: 8
displayRadius: 8
isBio: true
hideScorchMark: true
softCollisionOnAll: 0
transportSlotsNeeded: 1
soundOnMoveOrder:ROOT:/ogg/rf/1.OGG,ROOT:/ogg/rf/2.OGG,ROOT:/ogg/rf/3.OGG,ROOT:/ogg/rf/4.OGG,ROOT:/ogg/rf/5.OGG,ROOT:/ogg/rf/6.OGG
energyMax: 50
energyRegen: 0.1
energyNeedsToRechargeToFull: true

effectOnDeath:Custom:death

[graphics]
total_frames: 11

image:        rpg7vl.png
image_wreak:  T1_dead.png
image_turret: NONE
imageScale:0.3
image_shadow:ROOT:/PNG/Infantry/shadow.png
shadowOffsetX:0
shadowOffsetY:0

animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 12

animation_idle_start:3
animation_idle_end:3
animation_idle_speed:1

animation_attack_start:4
animation_attack_end:10
animation_attack_speed:15

lock_body_rotation_with_main_turret: true

[effect_death]

spawnChance: 0.8
alsoEmitEffects:CUSTOM:blood*18


[effect_blood]

image:ROOT:/PNG/Infantry/blood.png
xOffsetRelative:0
yOffsetRelative:1
attachedToUnit: false
life: 90
physics: true

xSpeedRelativeRandom: 0.8
ySpeedRelativeRandom: 0.8
hSpeed: 1.2

priority: high
scaleFrom:0.9
scaleTo: 0.4
dirSpeedRandom:20


[effect_glow]
xOffsetRelative:1
attachedToUnit: false
life: 8
alpha: 2
image:ROOT:/PNG/Infantry/glow.png
priority: high
drawUnderUnits:false
scaleFrom:0
scaleTo: 1.8

[effect_glow2]
xOffsetRelative:1
attachedToUnit: false
life: 8
alpha: 2
image:ROOT:/PNG/Infantry/glow2.png
priority: high
drawUnderUnits:false
scaleFrom:0.2
scaleTo: 0.6

[effect_smoke]
spawnChance:0.2
xOffsetRelative:1
attachedToUnit: false
life: 100
alpha: 0.4
scaleFrom:0.3
scaleTo: 1.1
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
hSpeed: 0.1
image:ROOT:/PNG/Infantry/smoke.png
priority: low
drawUnderUnits:false
atmospheric:true
dirOffsetRandom:360

[effect_shell]
xOffsetRelative:2
yOffsetRelative:-10
attachedToUnit: false
life: 300
physics: true
xSpeedRelative: 0.3
xSpeedRelativeRandom: 0.3
ySpeedRelativeRandom: 0.3
hSpeed: 1.2
image:ROOT:/PNG/Infantry/rpg22.png
priority: low
drawUnderUnits:true
scaleFrom:0.3
scaleTo: 0.3
dirSpeedRandom:20

[attack]
isMelee: false
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   if not self.hasFlag(id=20)
canAttackUnderwaterUnits: false
turretRotateWithBody: true
turretSize: 13
turretTurnSpeed: 6

isFixedFiring: true

maxAttackRange: 470

shootDelay: 5

aimOffsetSpread: 0.4

[turret_shoot]
x:0
y:-2
projectile:1
invisible: true
warmup: 5
idleDir: 0

shoot_sound:ROOT:/ogg/rf/rpg7.OGG
shoot_sound_vol:0.75

#shoot_flame:CUSTOM:glow,CUSTOM:glow
shoot_light:#ffff4900
recoilOffset: 0
energyUsage: 50
resourceUsage: rpgof=1

canAttackCondition: if self.hasFlag(id=1)



[projectile_1]
directDamage: 1
life: 200
speed: 7
frame: 1
image:7vl.png
drawSize: 0.5
targetGround:true
targetGroundSpread: 5
areaRadius: 28
areaDamage:500
explodeEffect:CUSTOM:lostShot
trailEffect:CUSTOM:projectileTrail
trailEffectRate:1
tags:rpg,HEAT
armourIgnoreAmount:500


mutator2_ifUnitWithTags: AntiHEAT
mutator2_directDamageMultiplier: 1
mutator2_areaDamageMultiplier: 3


spawnProjectilesOnExplode:1(spawnChance=0.4)




[effect_projectileTrail]
priority:critical

stripIndex: effects
frameIndex: 0


life: 75
fadeOut: true
attachedToUnit: false
color: #ffffff
fadeInTime:1.5
scaleFrom: 0.2
scaleTo: 0.3
alpha: 0.5
drawUnderUnits:false

atmospheric:true


shadow:true
yOffsetRelative: -10
xSpeedAbsoluteRandom: 0.2
ySpeedAbsoluteRandom: 0.2



[effect_trail]
stripIndex: effects
frameIndex: 0


life: 40
image:ROOT:/PNG/Infantry/Trail_rpg.png
color: #CCCCDD

priority: high

attachedToUnit: false
atmospheric: true
#physics: false
#physicsGravity: 0

#xOffsetRelative: 20.0
yOffsetRelative: -20
#xSpeedRelative: 0
#ySpeedRelative: 0

scaleFrom: 1
scaleTo: 1

alpha: 1


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: 7.62LPS=4,rpgof=4,setFlag=1

[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:7.62LPS=3




[hiddenAction_created]
autoTriggerOnEvent: created
alsoTriggerAction: waypoint2


[hiddenAction_waypoint2]
addWaypoint_type: follow
addWaypoint_target_nearestUnit_tagged: T2_comander
addWaypoint_target_nearestUnit_team: own


[effect_lostShot]
spawnChance:0.01
attachedToUnit: false
life: 60
ySpeedRelative: 6
image:ROOT:/PNG/Infantry/Rpg22_shell.png
scaleFrom:0.15
scaleTo: 0.15
priority: low

