
[core]
copyFrom:ROOT:/template/medic.template
name: T1_rus_Med_somali
tags: medik
class: CustomUnitMetadata
#overrideAndReplace: antiAirTurret
price: 85
maxHp: 100
mass: 30
displayText: Medic (Somali)
displayText_ru: Медик (Сомали)
displayDescription: -Has 6B45 bulletproof vest\n-Armed with AK-74 carabine\n-Can heal wounded soldiers
displayDescription_ru: -Бронежилет 6Б45\n-Вооружен карабином АК-74\n -Может лечить раненных солдат
techLevel: 1
buildSpeed: 0.003
#availableInDemo: true
fogOfWarSightRange: 16
radius: 8
displayRadius: 8
isBio: true
hideScorchMark: true
softCollisionOnAll: 0
transportSlotsNeeded: 1
soundOnMoveOrder:ROOT:/ogg/rf/1.OGG,ROOT:/ogg/rf/2.OGG,ROOT:/ogg/rf/3.OGG,ROOT:/ogg/rf/4.OGG,ROOT:/ogg/rf/5.OGG,ROOT:/ogg/rf/6.OGG
energyMax: 20
energyRegen: 0.18
energyNeedsToRechargeToFull: true

canRepairBuildings: true
canRepairUnits : true
autoRepair:true
nanoRange: 50
nanoRepairSpeed: 0.5
nanoBuildSpeed: 1
nanoFactorySpeed: 1

effectOnDeath:Custom:death

[graphics]
total_frames: 11

image:        1.png
image_wreak:  2.png
image_turret: NONE
imageScale:0.3
image_shadow:ROOT:/PNG/Infantry/shadow.png
shadowOffsetX:0
shadowOffsetY:0

animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 12

animation_idle_start:3
animation_idle_end:3
animation_idle_speed:1

animation_attack_start:3
animation_attack_end:10
animation_attack_speed:15

lock_body_rotation_with_main_turret: true

[effect_death]

spawnChance: 0.8
alsoEmitEffects:CUSTOM:blood*18


[effect_blood]

image:ROOT:/PNG/Infantry/blood.png
xOffsetRelative:0
yOffsetRelative:1
attachedToUnit: false
life: 90
physics: true

xSpeedRelativeRandom: 0.8
ySpeedRelativeRandom: 0.8
hSpeed: 1.2

priority: high
scaleFrom:0.9
scaleTo: 0.4
dirSpeedRandom:20


[effect_glow]
xOffsetRelative:1
attachedToUnit: false
life: 8
alpha: 2
image:ROOT:/PNG/Infantry/glow.png
priority: high
drawUnderUnits:false
scaleFrom:0
scaleTo: 1.8

[effect_glow2]
xOffsetRelative:1
attachedToUnit: false
life: 8
alpha: 2
image:ROOT:/PNG/Infantry/glow2.png
priority: high
drawUnderUnits:false
scaleFrom:0.2
scaleTo: 0.6

[effect_smoke]
spawnChance:0.2
xOffsetRelative:1
attachedToUnit: false
life: 100
alpha: 0.4
scaleFrom:0.3
scaleTo: 1.1
xSpeedRelativeRandom: 0.2
ySpeedRelativeRandom: 0.2
hSpeed: 0.1
image:ROOT:/PNG/Infantry/smoke.png
priority: low
drawUnderUnits:false
atmospheric:true
dirOffsetRandom:360

[effect_shell]
xOffsetRelative:2
yOffsetRelative:-10
attachedToUnit: false
life: 250
physics: true
xSpeedRelative: 0.5
xSpeedRelativeRandom: 0.3
ySpeedRelativeRandom: 0.3
hSpeed: 1.2
image:ROOT:/PNG/Infantry/shell.png
priority: low
drawUnderUnits:true
scaleFrom:0.6
scaleTo: 0.6
dirSpeedRandom:20

[attack]
isMelee: false
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   if not self.hasFlag(id=20)
canAttackUnderwaterUnits: false
turretRotateWithBody: true
turretSize: 13
turretTurnSpeed: 6

isFixedFiring: true

maxAttackRange: 340

shootDelay: 5

aimOffsetSpread: 0.3

[turret_1]
#nano turret (nano must be slot 1)
x: 0
y: 0
invisible: true
canShoot: false
warmup:30
isMainNanoTurret: true

[turret_shoot]
x:0
y:-2
projectile:1
invisible: true
warmup: 5
idleDir: 0

shoot_sound:ROOT:/ogg/rf/ak74.OGG
shoot_sound_vol:0.75

shoot_flame:CUSTOM:glow,CUSTOM:glow2, CUSTOM:shell
shoot_light:#ffff4900
recoilOffset: 0
energyUsage: 3.1
resourceUsage: 7.62LPS=1



[projectile_1]
directDamage: 25
life: 153
speed: 10
frame: 1
image:ROOT:/PNG/Infantry/bala.png
drawSize: 0.4
targetGround:true
targetGroundSpread: 2.5
areaRadius: 4
areaDamage:25
explodeEffect:CUSTOM:lostShot
trailEffect: CUSTOM:trail


[hiddenAction_start]
autoTriggerOnEvent: created
addResources: 7.62LPS=100

[hiddenAction_ammoReload]
autoTrigger: if  numberOfUnitsInTeam(withTag='Ammo',withinRange=100,greaterThan=0) and self.queueSize(lessThan=1)
alsoQueueAction:LoadBK

[hiddenAction_LoadBK]
buildSpeed: 5s
addResources:7.62LPS=120


[effect_trail]
stripIndex: effects
frameIndex: 0


life: 40
image:ROOT:/PNG/Infantry/Trail.png
color: #CCCCDD

priority: high

attachedToUnit: false
atmospheric: true
#physics: false
#physicsGravity: 0

#xOffsetRelative: 20.0
yOffsetRelative: -20
#xSpeedRelative: 0
#ySpeedRelative: 0

scaleFrom: 1
scaleTo: 1

alpha: 1



[hiddenAction_created]
autoTriggerOnEvent: created
alsoTriggerAction: waypoint2


[hiddenAction_waypoint2]
addWaypoint_type: follow
addWaypoint_target_nearestUnit_tagged: T1_comander
addWaypoint_target_nearestUnit_team: own


[effect_lostShot]
spawnChance:0.85
attachedToUnit: false
life: 60
ySpeedRelative: 6
image:ROOT:/PNG/Infantry/bala.png
scaleFrom:0.15
scaleTo: 0.15
priority: low

[movement]

movementType: LAND
moveSpeed: 0.5
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12

maxTurnSpeed: 3
turnAcceleration: 2.5

moveSlidingMode: false
moveIgnoringBody: true
moveSlidingDir:  181


[ai]

buildPriority: 0.7

noneInBaseExtraPriority: 0.03

noneGlobalExtraPriority: 0.15

useAsBuilder: true
maxGlobal: 8
maxEachBase: 8



















































