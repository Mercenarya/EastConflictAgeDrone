[core]
copyFrom:ROOT:/template/Infantry.template
name: OperatorRU
class: CustomUnitMetadata
price: 200
maxHp: 100
mass: 30
tags: infantry, UAV, UAV_OPERATOR, operator
armour: 10
armourMinDamageToKeep: 0
displayText: Operator UAV (RF)
displayText_ru: Оператор БПЛА (РФ)
displayDescription: - Russian Armed Forces UAV & UGV Operator \n- Specializes in rapid deployment, surveillance, and drone warfare \n- Can spam tactical UAVs, loitering munitions, and combat UGVs
displayDescription_ru: - Оператор БПЛА и робототехнических комплексов ВС РФ \n- Быстрое развертывание БПЛА, барражирующих боеприпасов и наземных боевых роботов \n- Оснащен терминалом управления роем дронов
techLevel: 1
buildSpeed: 5s
fogOfWarSightRange: 16
radius: 8
displayRadius: 8
isBio: true
hideScorchMark: true
softCollisionOnAll: 0
transportSlotsNeeded: 1
soundOnMoveOrder: ROOT:/ogg/rf/1.OGG, ROOT:/ogg/rf/2.OGG, ROOT:/ogg/rf/3.OGG, ROOT:/ogg/rf/4.OGG, ROOT:/ogg/rf/5.OGG, ROOT:/ogg/rf/6.OGG

isBuilder: true
canRepairUnits: true
autoRepair: false
nanoRange: 35
nanoRepairSpeed: 0.3
energyMax: 100
energyRegen: 0.5
energyNeedsToRechargeToFull: false

effectOnDeath: Custom:death

# --- BUILD LIST ---
canBuild_1_name: Drone, eleron, kub2, Kub-2 launcher, UAV "Granat-E", UAV "Granat-1E", Kursir, Fixed-wing UAV "Legionare-E", MIS Copter, VTOL
canBuild_1_pos: 1

