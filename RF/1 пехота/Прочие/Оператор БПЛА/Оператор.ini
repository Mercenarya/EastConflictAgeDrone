life: 250
physics: true
xSpeedRelative: 0.5
xSpeedRelativeRandom: 0.3
ySpeedRelativeRandom: 0.3
hSpeed: 1.2
image: ROOT:/PNG/Infantry/shell.png
priority: low
drawUnderUnits: true
scaleFrom: 0.6
scaleTo: 0.6
dirSpeedRandom: 20

[attack]
