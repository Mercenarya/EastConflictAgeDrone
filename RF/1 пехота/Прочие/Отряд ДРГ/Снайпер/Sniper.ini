[core]
copyFrom:ROOT:/template/Infantry.template
name: SniperRF
class: CustomUnitMetadata
price: 800
maxHp: 100
mass: 30
displayText: Sniper (DRG RF)
displayText_ru: Снайпер (ДРГ РФ)
displayDescription: -Armed with SVD sniper rifle
displayDescription_ru: -Вооружен снайперской винтовкой СВД
techLevel: 2
buildSpeed: 0.003
#availableInDemo: true
fogOfWarSightRange: 15
radius: 8
displayRadius: 8
isBio: true
hideScorchMark: true
softCollisionOnAll: 0
transportSlotsNeeded: 1
soundOnMoveOrder:ROOT:/ogg/rf/1.OGG,ROOT:/ogg/rf/2.OGG,ROOT:/ogg/rf/3.OGG,ROOT:/ogg/rf/4.OGG,ROOT:/ogg/rf/5.OGG,ROOT:/ogg/rf/6.OGG


energyMax: 100
energyRegen: 0.1
energyNeedsToRechargeToFull: true

effectOnDeath:Custom:death

[graphics]
total_frames: 11
icon_zoomed_out_neverShow:true
image:        T3_sniper.png
image_wreak:  T3_sniper_dead.png
image_turret: NONE
imageScale:0.3
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1

animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 12

animation_idle_start:3
animation_idle_end:3
animation_idle_speed:1

animation_attack_start:3
animation_attack_end:10
animation_attack_speed:15

lock_body_rotation_with_main_turret: true

[effect_death]
life: 0
spawnChance: 1
fadeInTime: 0
fadeOut: false

alsoPlaySound:  ROOT:/ogg/amer/Dead.ogg: 0.20
[attack]
isMelee: false
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   if not self.hasFlag(id=20)
canAttackUnderwaterUnits: false
turretRotateWithBody: true
turretSize: 13
turretTurnSpeed: 6

isFixedFiring: true

maxAttackRange: 321
shootDelay: 11

[turret_shoot]
x:-1.5
y:1
projectile:1
invisible: true
warmup: 5
idleDir: 0
shoot_sound: ROOT:/ogg/amer/L96_shot.ogg
shoot_sound_vol:0.50
shoot_flame:small,CUSTOM:casquillo,CUSTOM:humo
shoot_light:#ffff4900
recoilOffset: 0
energyUsage: 20

[turret_recharge]
x:-1.5
y:1
projectile:1
invisible: true
warmup: 90
idleDir: 0
attachedTo: shoot
slave: true
shoot_sound: ROOT:/ogg/amer/DolgP47r.ogg
shoot_sound_vol:0.50
shoot_flame:small,CUSTOM:casquillo,CUSTOM:humo
shoot_light:#ffff4900
recoilOffset: 0
energyUsage: 3

[effect_casquillo]
attachedToUnit: false
life: 600
xOffsetAbsolute: 2
yOffsetAbsolute: -1
physics: true
xSpeedRelativeRandom: 1
ySpeedRelativeRandom: 1
hSpeed: 1
image:ROOT:/PNG/Infantry/shell.png
scaleFrom: 0.2
scaleTo: 0.19


[effect_humo]
frameIndex: 0
stripIndex: smoke_black
spawnChance: 1
life: 90
fadeOut: true
attachedToUnit: false
color: #FFFFFF
fadeInTime:15
scaleFrom: 0.3
scaleTo: 0.6
alpha: 0.8
drawUnderUnits:false
liveAfterAttachedDies: false
hSpeed:0.2
dirOffsetRandom:180
atmospheric: true

[projectile_1]
directDamage: 1
life: 153
speed: 13
frame: 1
image:ROOT:/PNG/Infantry/bala.png
drawSize: 0.5
targetGround:true
targetGroundSpread: 1
areaRadius: 11
areaDamage:52
explodeEffect:none



[movement]

movementType: LAND
moveSpeed: 0.45
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12

maxTurnSpeed: 8.5
turnAcceleration: 2.5

moveSlidingMode: false
moveIgnoringBody: true
moveSlidingDir:  181


[action_trigger_mas]
autoTrigger:if not numberOfUnitsInEnemyTeam(withinRange=70, greaterThan=0)
convertTo: SniperRFM
isVisible:false






















