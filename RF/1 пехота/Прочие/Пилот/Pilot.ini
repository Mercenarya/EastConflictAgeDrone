showMessageToAllEnemyPlayers_ru: Воздушное судно противника было сбито, найдите пилота, прежде чем он эвакуируется


[action_trigger_mission]
autoTrigger:if numberOfUnitsInTeam(withTag='TAB',withinRange=130, greaterThan=0)
isVisible:false
deleteSelf:true
addResources: 3000

showMessageToPlayer: Mission Successful
showMessageToPlayer_ru:Вы доставили пилота в расположение штаба, мы выделяем вам дополнительные резервы!













